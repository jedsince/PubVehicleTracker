        // --- DEVICE ORIENTATION ---
        function handleDeviceOrientation(event) {
            let heading = event.alpha;
            if (typeof event.webkitCompassHeading !== 'undefined') {

            }
            if (heading !== null) {
                deviceOrientationHeading = heading < 0 ? 360 + heading : heading;

        // --- UTILITY FUNCTIONS ---
        function getSpeedColor(speed) {
            if (speed >= SPEED_THRESHOLDS.FAST) return '#28a745'; 
            if (speed >= SPEED_THRESHOLDS.MODERATE) return '#ffc107'; 
            if (speed > SPEED_THRESHOLDS.SLOW) return '#fd7e14'; 
            return '#dc3545'; 
        }

        function getHaversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }
        
        function simpleSnap(rawLat, rawLon, accuracy) {
            const precision = accuracy > 10 ? 4 : 5; 
            return { 
                lat: parseFloat(rawLat.toFixed(precision)), 
                lon: parseFloat(rawLon.toFixed(precision)) 
            }; 
        }

        // --- MAPBOX & TERMINAL DISPLAY ---
        function updateMarker(data) {
            const trackingId = data.tracking_id;
            if (!data.latitude || !data.longitude || !trackingId) return; 
            const type = data.vehicle_type || 'default';
            const newLngLat = [data.longitude, data.latitude];
            const speed = data.speed || 0;
            const heading = data.heading || 0; 
            const arrowColor = getSpeedColor(speed);
            let marker = activeMarkers.get(trackingId);
            
            if (!marker) {
                const el = document.createElement('div');
                el.className = 'direction-arrow';
                marker = new mapboxgl.Marker({ element: el, anchor: 'center' }) 
                    .setLngLat(newLngLat)
                    .setPopup(new mapboxgl.Popup({ offset: 25 })) 
                    .addTo(map);
                activeMarkers.set(trackingId, marker);
            }
            const markerElement = marker.getElement();
            markerElement.style.borderBottomColor = arrowColor;
            markerElement.style.transform = `rotate(${heading}deg)`;
            const speedKPH = speed * 3.6;
            marker.setLngLat(newLngLat)
                     .getPopup()
                    .setHTML(`
                        <h4>${type.toUpperCase()} Plate No.: ${trackingId}</h4>
                        <p>Speed: ${speedKPH.toFixed(1)} km/h<br>Heading: ${heading.toFixed(0)}&deg;</p>
                    `);
            
            // Auto-follow current tracking ID (sharer or viewer's selected vehicle)
            const isCurrentUser = isTracking && trackingId === currentTrackingId;
            const isViewerTracking = !isTracking && trackingId === currentTrackingId;

            if (isCurrentUser || isViewerTracking) {
                 map.flyTo({ center: newLngLat, speed: 0.5 });
            }
            
            if (!isCurrentUser) {
                // Fetch and display route for all tracked vehicles (if active route exists)
                fetchAndDisplayViewerRoute(trackingId, data.latitude, data.longitude); 
            }
        }

        async function fetchAndDisplayAllTerminals() {
            const { data, error } = await supabaseClient.from('terminals').select('*');
            if (error) { console.error('Error fetching terminals:', error.message); return; }
            startTerminalSelect.innerHTML = '<option value="">-- Auto-Detect (Default) --</option>';
            endTerminalSelect.innerHTML = '<option value="">-- Select Route & Destination --</option>';
            endTerminalSelect.disabled = true;
            activeTerminalMarkers.forEach(marker => marker.remove());
            activeTerminalMarkers.clear();
            allTerminals = data;
            allTerminals.forEach(terminal => {
                const option = document.createElement('option');
                option.value = terminal.id;
                option.textContent = `${terminal.name} (Route: ${terminal.route_id || 'N/A'})`;
                startTerminalSelect.appendChild(option);
                const el = document.createElement('div');
                el.className = 'terminal-marker';
                el.textContent = terminal.name[0].toUpperCase();
                const marker = new mapboxgl.Marker({ element: el, anchor: 'center' })
                    .setLngLat([terminal.longitude, terminal.latitude])
                    .setPopup(new mapboxgl.Popup({ offset: 25 }).setHTML(`<b>${terminal.name}</b><br>Route ID: ${terminal.route_id || 'N/A'}`))
                    .addTo(map);
                activeTerminalMarkers.set(terminal.id, marker);
            });
            console.log(`Loaded ${allTerminals.length} terminals and populated dropdowns.`);
        }

        async function fetchAndDisplayRoute(startTerminal, endTerminal, currentLat, currentLon) {
            const startCoords = `${startTerminal.longitude},${startTerminal.latitude}`;
            const endCoords = `${endTerminal.longitude},${endTerminal.latitude}`;
            
            // Include the vehicle's current location as a via point
            const currentCoords = `${currentLon},${currentLat}`;

            const coordsString = `${startCoords};${currentCoords};${endCoords}`;
            
            const url = `https://api.mapbox.com/directions/v5/mapbox/driving/${coordsString}?geometries=geojson&access_token=${mapboxgl.accessToken}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
                    const route = data.routes[0].geometry;
                    const geoJson = {
                        type: 'FeatureCollection',
                        features: [{ type: 'Feature', geometry: route }]
                    };
                    
                    const routeSource = map.getSource(TRIP_ROUTE_SOURCE_ID);
                    if (routeSource) {
                        routeSource.setData(geoJson);
                    } else {
                        console.error(`ERROR: Map source '${TRIP_ROUTE_SOURCE_ID}' not found. Cannot draw route.`);
                    }

                } else {
                    console.warn('Mapbox Directions API error:', data.code, data.message || 'Unknown error');
                }
            } catch (apiError) {
                console.error('Error fetching Mapbox Directions:', apiError);
            }
        }

        async function fetchAndDisplayViewerRoute(trackingId, currentLat, currentLon) { 
            clearDisplayedRoute(); 

            const { data, error } = await supabaseClient
                .from('active_routes')
                .select('*')
                .eq('tracking_id', trackingId)
                .eq('is_active', true); 

            if (error) { console.error('Error fetching viewer route:', error.message); return; }
            if (!data || data.length === 0) { return; }

            const routeData = data[0]; 

            const startTerminal = { latitude: routeData.start_lat, longitude: routeData.start_lon, name: routeData.start_name };
            const endTerminal = { latitude: routeData.end_lat, longitude: routeData.end_lon, name: routeData.end_name };
            
            fetchAndDisplayRoute(startTerminal, endTerminal, currentLat, currentLon); 
        }

        function subscribeToLocationUpdates() {

            supabaseClient.channel('all_terminals')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'terminals' }, (payload) => {
                    fetchAndDisplayAllTerminals();
                })

        }

        function handleMapClick(e) {
            if (!isPinningMode) return;
            clearTempPin();
            const lat = e.lngLat.lat;
            const lon = e.lngLat.lon;
            tempPinLocation = { lat: lat, lon: lon };
            const el = document.createElement('div');
            el.className = 'terminal-marker';
            el.textContent = '?'; 
            el.style.backgroundColor = '#ffc107'; 
            tempTerminalMarker = new mapboxgl.Marker({ element: el, anchor: 'center' })
                .setLngLat([lon, lat])
                .addTo(map);
            document.getElementById('pin-location-display').textContent = `Pin Dropped at: Lat ${lat.toFixed(4)}, Lon ${lon.toFixed(4)}`;
            document.getElementById('savePinButton').disabled = false;
        }

        function clearTempPin() {
            if (tempTerminalMarker) {
                tempTerminalMarker.remove();
                tempTerminalMarker = null;
            }
            tempPinLocation = null;
            document.getElementById('pin-location-display').textContent = '';
            document.getElementById('savePinButton').disabled = true;
        }

        function savePinnedTerminal() {
            const terminalName = document.getElementById('terminalNameInput').value;
            const routeId = document.getElementById('routeIdInput').value.toUpperCase();
            if (!terminalName) { alert("Please enter a name for the new stop/station!"); return; }
            if (!tempPinLocation) { alert("No pin dropped. Click the map first!"); return; }
            writeTerminalToSupabase(terminalName, tempPinLocation.lat, tempPinLocation.lon, routeId);
            togglePinningMode();
        }

        function captureAndSaveTerminal() {
            const terminalName = document.getElementById('terminalNameInput').value;
            const routeId = document.getElementById('routeIdInput').value.toUpperCase();
            if (!terminalName) { alert("Please enter a name!"); return; }
            if (!navigator.geolocation) { alert('Geolocation not supported.'); return; }
            const options = { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 };
            navigator.geolocation.getCurrentPosition(async (position) => {
                await writeTerminalToSupabase(terminalName, position.coords.latitude, position.coords.longitude, routeId);
                toggleSidebar(); // Close menu after action
            }, (err) => {
                alert(`Could not get GPS location: ${err.message}`);
            }, options);
        }
        
        async function writeTerminalToSupabase(name, lat, lon, routeId) {
            statusDiv.textContent = `Attempting to save ${name} (Route ${routeId || 'N/A'})...`;
            const { error } = await supabaseClient
                .from('terminals')
                .insert({
                    name: name, latitude: lat, longitude: lon, route_id: routeId || null 
                });
            if (error) {
                console.error('Terminal save error:', error);
                statusDiv.textContent = `ERROR saving stop/station: ${error.message}`;
                statusDiv.style.color = '#dc3545';
            } else {
                statusDiv.textContent = `Successfully SAVED new stop/station: ${name}!`;
                document.getElementById('terminalNameInput').value = '';
                document.getElementById('routeIdInput').value = ''; 
                fetchAndDisplayAllTerminals();
            }
        }

        // --- VIEWER/PASSENGER LOGIC ---
        
        function identifyNearbyRoutes() {
            viewerSelectionContainer.style.display = 'block';
            routeToTrackSelect.innerHTML = '<option value="">-- Searching for Nearby Stops/Stations... --</option>';
            if (!navigator.geolocation) {
                routeToTrackSelect.innerHTML = '<option value="">Geolocation not supported.</option>';
                return;
            }

            const options = { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 };
            navigator.geolocation.getCurrentPosition(position => {
                const currentLat = position.coords.latitude;
                const currentLon = position.coords.longitude;
                
                const nearbyTerminals = allTerminals.filter(terminal => {
                    return getHaversineDistance(currentLat, currentLon, terminal.latitude, terminal.longitude) < BEACON_TERMINAL_PROXIMITY_M;
                });

                const routeIds = [...new Set(nearbyTerminals.map(t => t.route_id).filter(id => id))];
                nearbyRoutes = routeIds;
                
                routeToTrackSelect.innerHTML = '<option value="">-- Select a Nearby Route --</option>';
                if (routeIds.length === 0) {
                    routeToTrackSelect.innerHTML = '<option value="">No active stops/stations within 500m.</option>';
                } else {
                    routeIds.forEach(id => {
                        const option = document.createElement('option');
                        option.value = id;
                        option.textContent = `Route: ${id}`;
                        routeToTrackSelect.appendChild(option);
                    });
                }
                vehicleToTrackSelect.disabled = false;
                setVehicleButton.disabled = false;
            }, (err) => {
                routeToTrackSelect.innerHTML = `<option value="">GPS Error: ${err.code}</option>`;
                console.error("Geolocation Error for Nearby Routes:", err);
            }, options);
        }

        async function fetchVehiclesOnRoute(routeId) {
            vehicleToTrackSelect.innerHTML = '<option value="">-- Loading Vehicles... --</option>';
            if (!routeId) {
                vehicleToTrackSelect.innerHTML = '<option value="">-- Choose Vehicle on Selected Route --</option>';
                return;
            }
            
            const { data, error } = await supabaseClient
                .from('active_routes')
                .select('tracking_id')
                .eq('route_id', routeId)
                .eq('is_active', true);

            if (error) {
                console.error("Error fetching vehicles for route:", error);
                vehicleToTrackSelect.innerHTML = '<option value="">Error loading vehicles.</option>';
                return;
            }

            vehicleToTrackSelect.innerHTML = '<option value="">-- Choose Vehicle Plate No. --</option>';
            data.forEach(route => {
                const option = document.createElement('option');
                option.value = route.tracking_id;
                option.textContent = `Plate No: ${route.tracking_id}`;
                vehicleToTrackSelect.appendChild(option);
            });

            if (data.length === 0) {
                vehicleToTrackSelect.innerHTML = '<option value="">No vehicles currently active on this route.</option>';
            }
        }

        function setVehicleAsBeacon() {
            const selectedTrackingId = vehicleToTrackSelect.value;
            if (!selectedTrackingId) {
                alert("Please select a vehicle's plate number first.");
                return;
            }
            // Stop current tracking if active (although passenger shouldn't be tracking)
            if(isTracking) stopLocationSharing(); 
            
            currentTrackingId = selectedTrackingId;
            statusDiv.textContent = `Tracking Plate No. ${currentTrackingId}...`;
            statusDiv.style.color = '#007bff';
            toggleSidebar(); // Close menu
        }


        // --- AUTHENTICATION FUNCTIONS ---
        async function handleLogin() {
            const email = emailInput.value;
            const password = passwordInput.value;
            loginErrorMessageDiv.textContent = '';
            statusDiv.textContent = 'Logging in...';

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                console.error("Login error:", error);
                loginErrorMessageDiv.textContent = `Login failed: ${error.message}`;
                statusDiv.textContent = 'Login Required.';
                return;
            }

            if (data.user) {
                const user = data.user;
                await checkUserRole(user.id);
                updateUI(user.id);
            }
        }

        async function handleSignUp() {
            const email = signupEmailInput.value;
            const password = signupPasswordInput.value;
            const name = signupNameInput.value;
            
            if (!email || !password || !name) {
                alert("Please fill in all required fields.");
                return;
            }

            // Note: role and tracking_id are provided as defaults for the SQL trigger. 
            const { error: authError } = await supabaseClient.auth.signUp({ 
                email, 
                password,
                options: {
                    data: { full_name: name, role: 'viewer', tracking_id: null } 
                }
            });

            if (authError) {
                alert(`Sign Up Error: ${authError.message}`);
                return;
            }
            
            alert('Account created! Please check your email for a confirmation link.');
            showLoginLink.click();
        }

        async function handleSignOut() {
            const { error } = await supabaseClient.auth.signOut();
            if (error) {
                console.error("Sign out error:", error);
                return;
            }
            currentUserRole = null;
            currentTrackingId = null;
            isTracking = false;
            if (intervalID) clearInterval(intervalID);
            updateUI(null);
            clearDisplayedRoute();
        }

        async function saveUserRoleSetup() {
            const userId = (await supabaseClient.auth.getUser()).data.user?.id;
            if (!userId) return;

            const newRole = userRoleSelect.value;
            const newTrackingId = setupTrackingIdInput.value.toUpperCase();

            if (!newRole) {
                alert("Please select a role.");
                return;
            }
            if (newRole === 'driver' && (!newTrackingId || newTrackingId.trim() === '')) {
                alert("Drivers must provide a Plate Number.");
                return;
            }

            const finalTrackingId = newRole === 'driver' ? newTrackingId : null;
            
            // --- CRITICAL UPDATE BLOCK ---
            const { error } = await supabaseClient
                .from('user_profiles') 
                .update({ 
                    role: newRole, 
                    tracking_id: finalTrackingId
                })
                .eq('id', userId);

            if (error) {
                // *** ENHANCED ERROR REPORTING ***
                alert(`Error saving role! The database rejected the update. Check RLS or Permissions. Error details: ${error.message}`);
                console.error("Error saving profile:", error);
            } else {
                alert(`Role saved as ${newRole}.`);
                
                // Update local state and UI after successful save
                currentUserRole = newRole;
                currentTrackingId = finalTrackingId;
                currentVehicleType = finalTrackingId ? finalTrackingId.split('-')[0] : 'vehicle'; 

                updateUI(userId); // Refresh UI based on new state
                toggleSidebar();
            }
        }

        async function checkUserRole(userId) {
            if (ADMIN_SHARER_IDS.includes(userId)) {
                currentUserRole = 'admin';
                console.log("User is Admin.");
            }
            
            const { data, error } = await supabaseClient
                .from('user_profiles') 
                .select('role, tracking_id')
                .eq('id', userId)
                .single();

            if (error && error.message.includes('0 rows')) { 
                // Expected scenario for brand new users or delayed trigger
                console.warn("Profile not found immediately. Assigning temporary 'viewer' role.");
                currentUserRole = 'viewer'; 
            } else if (error) {
                console.error("Error fetching profile:", error);
                currentUserRole = 'viewer'; 
            } else {
                currentUserRole = data.role;
                currentTrackingId = data.tracking_id;
                currentVehicleType = data.tracking_id ? data.tracking_id.split('-')[0] : 'vehicle'; 
                // Pre-select the role/tracking ID in the setup fields
                userRoleSelect.value = data.role || '';
                setupTrackingIdInput.value = data.tracking_id || '';
                setupTrackingIdInput.style.display = (data.role === 'driver' && data.tracking_id) ? 'block' : 'none';
            }

             console.log(`User role set to: ${currentUserRole}`);
        }

        async function updateUI(userId) {
            const session = await supabaseClient.auth.getSession();
            const loggedIn = session.data.session !== null;
            
            if (loggedIn && userId) {
                 await checkUserRole(userId); 
            }

            authContainer.style.display = loggedIn ? 'none' : 'block';
            signupContainer.style.display = 'none';
            signOutButton.style.display = loggedIn ? 'block' : 'none';
            sharerControlsContainer.style.display = loggedIn ? 'block' : 'none';
            terminalToolsContainer.style.display = 'none'; 
            floatingTrackingBtn.style.display = loggedIn ? 'block' : 'none';

            if (loggedIn) {
                const isDriver = currentUserRole === 'driver';
                const hasTrackingId = !!currentTrackingId;

                // --- Sidebar Controls visibility based on role ---
                document.getElementById('role-setup-container').style.display = 'block';

                if (isDriver && hasTrackingId) {
                    // Driver (Ready to share)
                    viewerSelectionContainer.style.display = 'none';
                    sharerRouteControl.style.display = 'flex';
                    statusDiv.textContent = `Ready to Share: ${currentTrackingId}`;
                    statusDiv.style.color = '#28a745';
                    floatingTrackingBtn.disabled = false;
                } else { 
                    // Viewer or Driver lacking a Plate Number (needs setup/tracking other)
                    sharerRouteControl.style.display = 'none';
                    identifyNearbyRoutes(); 
                    
                    if (currentUserRole === 'viewer') {
                        statusDiv.textContent = 'Logged in as Viewer/Passenger. Select a vehicle to track.';
                        statusDiv.style.color = '#007bff';
                    } else if (currentUserRole === 'driver' && !hasTrackingId) {
                        statusDiv.textContent = 'Driver: Set Plate Number in Account Setup.';
                        statusDiv.style.color = '#dc3545';
                    }
                    
                    floatingTrackingBtn.disabled = true;
                    floatingTrackingBtn.style.backgroundColor = '#6c757d'; // Greyed out
                    floatingTrackingBtn.textContent = '🚫';
                }

                // Admin/Terminal controls
                if (currentUserRole === 'admin') {
                    terminalToolsContainer.style.display = 'block';
                }
                
                // --- Floating Button State (Visual only) ---
                if (isTracking) {
                    floatingTrackingBtn.classList.remove('share-btn');
                    floatingTrackingBtn.classList.add('stop-btn');
                    floatingTrackingBtn.textContent = '■';
                } else if (isDriver && hasTrackingId) {
                    floatingTrackingBtn.classList.remove('stop-btn');
                    floatingTrackingBtn.classList.add('share-btn');
                    floatingTrackingBtn.textContent = '▶';
                }

            } else {
                statusDiv.textContent = 'Login Required.';
                statusDiv.style.color = '#dc3545';
                if (intervalID) { clearInterval(intervalID); intervalID = null; }
            }
        }

        // --- LOCATION SHARING/PINGING LOGIC ---
        function toggleLocationSharing() {
            if (!currentUserRole || currentUserRole === 'viewer' || !currentTrackingId) {
                alert("Please set your role as 'Driver' and provide a Plate Number in Account Setup before sharing location.");
                return;
            }
            if (isTracking) {
                stopLocationSharing();
            } else {
                startLocationSharing();
            }
        }

        function startLocationSharing() {
            if (!navigator.geolocation) {
                alert('Geolocation is not supported by this browser.');
                return;
            }

            statusDiv.textContent = `Attempting to start location sharing...`;
            floatingTrackingBtn.disabled = true;

            const options = { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 };
            navigator.geolocation.getCurrentPosition(position => {
                isTracking = true;
                floatingTrackingBtn.classList.remove('share-btn');
                floatingTrackingBtn.classList.add('stop-btn');
                floatingTrackingBtn.textContent = '■';
                floatingTrackingBtn.disabled = false;
                
                // First ping immediately
                updateLocationInSupabase(position); 

                // Set up recurring pings
                intervalID = setInterval(() => {
                    navigator.geolocation.getCurrentPosition(updateLocationInSupabase, handleGeolocationError, options);
                }, PING_RATE_MS);
            }, handleGeolocationError, options);
        }

        function stopLocationSharing() {
            isTracking = false;
            if (intervalID) {
                clearInterval(intervalID);
                intervalID = null;
            }
            floatingTrackingBtn.classList.remove('stop-btn');
            floatingTrackingBtn.classList.add('share-btn');
            floatingTrackingBtn.textContent = '▶';
            statusDiv.textContent = `Location sharing stopped for ${currentTrackingId}.`;
            statusDiv.style.color = '#dc3545';
            clearDisplayedRoute();
            
            markRouteAsInactive();
            
            currentTrip = { isTrackingTrip: false, startPoint: null, lastStop: null, stopTimer: null, identifiedStartTerminal: null, identifiedEndTerminal: null };
        }

        async function markRouteAsInactive() {
            const { error } = await supabaseClient
                .from('active_routes')
                .update({ is_active: false })
                .eq('tracking_id', currentTrackingId);
            
            if (error) console.error("Error marking route inactive:", error);
        }

        function handleGeolocationError(error) {
            console.error('Geolocation Error:', error);
            statusDiv.textContent = `GPS Error: ${error.message}. Sharing stopped.`;
            statusDiv.style.color = '#dc3545';
            stopLocationSharing();
        }

        // --- NEW updateLocationInSupabase function ---
        async function updateLocationInSupabase(position) {
            // Fetch the current user ID
            const userSession = await supabaseClient.auth.getUser();
            const userId = userSession.data.user?.id;
            
            if (!userId) {
                console.error("User ID missing. Cannot share location.");
                statusDiv.textContent = "ERROR: User ID missing. Log out and back in.";
                statusDiv.style.color = '#dc3545';
                return;
            }
            
            const { latitude: rawLat, longitude: rawLon, speed, heading, accuracy } = position.coords;
            const { lat, lon } = simpleSnap(rawLat, rawLon, accuracy);
            const speedKPH = (speed || 0) * 3.6; 
            const finalHeading = (heading !== null && heading > 0) ? heading : (deviceOrientationHeading || 0);
            
            const { error } = await supabaseClient
                .from('vehicle_location')
                .upsert({
                    tracking_id: currentTrackingId,
                    sharer_id: userId, // <-- NEW: Include the required sharer_id
                    latitude: lat,
                    longitude: lon,
                    speed: speedKPH / 3.6, 
                    heading: finalHeading,
                    accuracy: accuracy,
                    vehicle_type: currentVehicleType, 
                    last_updated: new Date().toISOString()
                }, { on_conflict: 'tracking_id' }); 

            if (error) {
                console.error("Supabase update/insert error:", error);
                statusDiv.textContent = `ERROR: Data not shared. ${error.message.substring(0, 50)}...`;
                statusDiv.style.color = '#dc3545';
            } else {
                statusDiv.textContent = `Sharing ON. Plate No.: ${currentTrackingId} | Speed: ${speedKPH.toFixed(1)} km/h`;
                statusDiv.style.color = getSpeedColor(speedKPH / 3.6);
            }
        }
        // --- END NEW updateLocationInSupabase function ---


        // --- MANUAL ROUTE LOGIC ---
        function populateEndTerminalSelect(startTerminalId) {
             endTerminalSelect.innerHTML = '<option value="">-- Select Destination Point --</option>';
             endTerminalSelect.disabled = true;
             
             if (!startTerminalId) return;

             const selectedStartTerminal = allTerminals.find(t => t.id == startTerminalId);
             if (!selectedStartTerminal || !selectedStartTerminal.route_id) return;

             endTerminalSelect.disabled = false;
             allTerminals
                .filter(t => t.route_id === selectedStartTerminal.route_id && t.id != startTerminalId)
                .forEach(terminal => {
                    const option = document.createElement('option');
                    option.value = terminal.id;
                    option.textContent = terminal.name;
                    endTerminalSelect.appendChild(option);
                });
        }
        
        async function drawManualRoute() {
            if (!currentTrackingId) {
                alert("Please set your Plate Number in Account Setup before setting a route.");
                return;
            }

            const startId = startTerminalSelect.value;
            const endId = endTerminalSelect.value;

            if (!startId || !endId) {
                alert("Please select both a starting and a destination point.");
                return;
            }

            const startTerminal = allTerminals.find(t => t.id == startId);
            const endTerminal = allTerminals.find(t => t.id == endId);

            if (!navigator.geolocation) {
                alert('Cannot draw route without current GPS location.');
                return;
            }
            navigator.geolocation.getCurrentPosition(async (position) => {
                 const currentLat = position.coords.latitude;
                 const currentLon = position.coords.longitude;
                 
                 await fetchAndDisplayRoute(startTerminal, endTerminal, currentLat, currentLon);

                 const { error } = await supabaseClient
                    .from('active_routes')
                    .upsert({
                        tracking_id: currentTrackingId,
                        route_id: startTerminal.route_id,
                        is_active: true,
                        start_lat: startTerminal.latitude,
                        start_lon: startTerminal.longitude,
                        end_lat: endTerminal.latitude,
                        end_lon: endTerminal.longitude,
                        start_name: startTerminal.name,
                        end_name: endTerminal.name
                    }, { on_conflict: 'tracking_id' }); 
                 
                 if (error) console.error("Error saving active route:", error);

                 statusDiv.textContent = `Route set from ${startTerminal.name} to ${endTerminal.name}.`;
                 statusDiv.style.color = '#007bff';
                 toggleSidebar();

            }, (err) => {
                alert(`Could not get GPS location for route drawing: ${err.message}`);
            }, { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 });

        }

        // --- EVENT LISTENERS ---
        floatingTrackingBtn.addEventListener('click', toggleLocationSharing);
        loginButton.addEventListener('click', handleLogin);
        signOutButton.addEventListener('click', handleSignOut);
        signupButton.addEventListener('click', handleSignUp);
        
        // NEW ROLE SETUP LISTENERS
        userRoleSelect.addEventListener('change', () => {
            if (userRoleSelect.value === 'driver') {
                setupTrackingIdInput.style.display = 'block';
            } else {
                setupTrackingIdInput.style.display = 'none';
                setupTrackingIdInput.value = ''; // Clear if switching to viewer
            }
        });
        saveRoleButton.addEventListener('click', saveUserRoleSetup);

        document.getElementById('dropPinButton').addEventListener('click', togglePinningMode);
        document.getElementById('savePinButton').addEventListener('click', savePinnedTerminal);
        document.getElementById('captureGPSButton').addEventListener('click', captureAndSaveTerminal);
        document.getElementById('toggleTerminalMenuBtn').addEventListener('click', () => {
             document.getElementById('terminal-submenu').style.display = document.getElementById('terminal-submenu').style.display === 'none' ? 'flex' : 'none';
        });

        // Toggle between login and signup forms
        showSignupLink.addEventListener('click', (e) => {
            e.preventDefault();
            authContainer.style.display = 'none';
            signupContainer.style.display = 'block';
            loginErrorMessageDiv.textContent = '';
        });
        showLoginLink.addEventListener('click', (e) => {
            e.preventDefault();
            authContainer.style.display = 'block';
            signupContainer.style.display = 'none';
        });

        // Manual Route Controls
        startTerminalSelect.addEventListener('change', (e) => {
            populateEndTerminalSelect(e.target.value);
        });
        drawManualRouteButton.addEventListener('click', drawManualRoute);
        clearManualRouteButton.addEventListener('click', () => {
             clearDisplayedRoute();
             markRouteAsInactive();
             statusDiv.textContent = `Manual route cleared.`;
             statusDiv.style.color = '#dc3545';
        });

        // Passenger/Viewer Controls
        routeToTrackSelect.addEventListener('change', (e) => {
            fetchVehiclesOnRoute(e.target.value);
        });
        setVehicleButton.addEventListener('click', setVehicleAsBeacon);

        // Initial check on page load
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                updateUI(session.user.id);
            } else {
                updateUI(null);
            }
        });
    </script>
</body>
</html>
