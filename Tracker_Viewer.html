        /**

        async function success(position) {
            const rawLat = position.coords.latitude;

            // UPDATE the record in the Supabase table (This replaces socket.emit)
            const { error: updateError } = await supabase
                .from('vehicle_location')
                .update({ 
                    latitude: snappedLocation.lat, 
                    longitude: snappedLocation.lon 
                })
                .eq('id', TRACKED_VEHICLE_ID);

            if (updateError) {
                 console.error('Supabase update error:', updateError);
                 statusDiv.textContent = 'Error sharing location. Check Supabase rules.';
            } else {
                 statusDiv.textContent = `Sharing location. Accuracy: ${acc.toFixed(1)}m.`;
                 statusDiv.style.color = '#28a745';
            }
        }

        /**

        function error(err) {
            statusDiv.textContent = `Tracking stopped. ERROR(${err.code}): ${err.message}`;
            statusDiv.style.color = '#dc3545';
            stopTracking();
        }

        /**
         * Starts the continuous location tracking.
         */
        function startTracking() {
            if (!navigator.geolocation) {
                statusDiv.textContent = 'Geolocation is not supported by your browser.';
                return;
            }
            
            const options = { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 };
            watchID = navigator.geolocation.watchPosition(success, error, options);
            isTracking = true;

            toggleButton.textContent = "Stop Sharing Location";
            toggleButton.classList.remove('share-btn');
            toggleButton.classList.add('stop-btn');
        }

        /**
         * Stops the continuous location tracking.
         */
        function stopTracking() {
             if (watchID !== null) {
                navigator.geolocation.clearWatch(watchID);
                watchID = null;
            }

            toggleButton.classList.remove('stop-btn');
            toggleButton.classList.add('share-btn');
