<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚌 Secure Transport Sharer & Viewer</title>

    <script src='https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css' rel='stylesheet' />
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 60vh; } 
        .header {
            background-color: #007bff;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .controls {
            padding: 10px 20px;
            background-color: #f8f9fa;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        #auth-container {
            padding: 20px; 
            text-align: center; 
            background-color: #e9ecef;
            border-bottom: 2px solid #007bff;
        }
        .input-group input, .input-group button {
            padding: 10px; 
            margin: 5px; 
            border: 1px solid #ccc; 
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .share-btn { background-color: #28a745; color: white; }
        .stop-btn { background-color: #dc3545; color: white; }
        .status-text { font-weight: bold; }
        
        /* CSS for the custom directional arrow marker (Triangle Shape) */
        .direction-arrow {
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 20px solid;
            position: relative;
            border-radius: 2px;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    
    <div id="auth-container">
        <h2>Location Sharer Login</h2>
        <div class="input-group">
            <input type="email" id="email" placeholder="Sharer Email">
            <input type="password" id="password" placeholder="Password">
            <button id="loginButton">Login</button>
        </div>
    </div>

    <div class="header">
        <h1>Live Transport Viewer</h1>
        <p>Login is required to share location, viewing is public.</p>
    </div>

    <div class="controls">
        <button id="toggleButton" class="share-btn" disabled>Start Sharing Location</button>
        <div id="status" class="status-text">Checking login status...</div>
    </div>

    <div id='map'></div>

    <script>
        // --- CONFIGURATION ---
        const SUPABASE_URL = 'https://uwptdzzlklkwoxudvrgc.supabase.co';
        // CRITICAL FIX: The correct anon key is used here.
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3cHRkenpsa2xrd294dWR2cmdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIxNDg1NzIsImV4cCI6MjA3NzcyNDU3Mn0.fziXt9gx2ZBDiUxdzU2gupMgXBuneOteWa90L3C5F1k';
        mapboxgl.accessToken = 'pk.eyJ1Ijoiam1hZXN0cm8iLCJhIjoiY2xrZjVvZXcxMWF5ZTNlanNlcGJrcWhqNyJ9.0nAf21DdJ4dlaSmyQrkwxg';
        
        const DEFAULT_CENTER = [121.0284546, 14.928021]; 
        
        // Speed in Meters Per Second (m/s) for color coding the arrows
        const SPEED_THRESHOLDS = {
            FAST: 8.33,   // approx. 30 km/h (Green)
            MODERATE: 2.78, // approx. 10 km/h (Yellow)
            SLOW: 0.5    // approx. 1.8 km/h (Orange)
        };
        
        const PING_RATE_MS = 30000; // 30 seconds for battery conservation
        const MIN_STOP_TIME_MS = 180000; // 3 minutes to confirm a terminal stop

        // --- STATE & UTILITIES ---
        let intervalID = null; 
        let isTracking = false;
        
        const activeMarkers = new Map(); 

        let currentTrackingId = null; 
        let currentVehicleType = null;

        // --- TRIP STATE VARIABLES ---
        let currentTrip = {
            isTrackingTrip: false, 
            startPoint: null,      
            lastStop: null,        
            stopTimer: null        
        };
        
        const toggleButton = document.getElementById('toggleButton');
        const statusDiv = document.getElementById('status');
        const authContainer = document.getElementById('auth-container');
        const loginButton = document.getElementById('loginButton');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // --- MARKER UTILITIES (Directional Arrow Logic) ---
            
        function getSpeedColor(speed) {
            if (speed >= SPEED_THRESHOLDS.FAST) {
                return '#28a745'; 
            } else if (speed >= SPEED_THRESHOLDS.MODERATE) {
                return '#ffc107'; 
            } else if (speed > SPEED_THRESHOLDS.SLOW) {
                return '#fd7e14'; 
            } else {
                return '#dc3545'; 
            }
        }

        function updateMarker(data) {
            const trackingId = data.tracking_id;
            if (!data.latitude || !data.longitude || !trackingId) return; 

            const type = data.vehicle_type || 'default';
            const newLngLat = [data.longitude, data.latitude];
            const speed = data.speed || 0;
            const heading = data.heading || 0; 

            const arrowColor = getSpeedColor(speed);
            let marker = activeMarkers.get(trackingId);

            if (!marker) {
                const el = document.createElement('div');
                el.className = 'direction-arrow';

                marker = new mapboxgl.Marker({ element: el, anchor: 'center' }) 
                    .setLngLat(newLngLat)
                    .setPopup(new mapboxgl.Popup({ offset: 25 })) 
                    .addTo(map);

                activeMarkers.set(trackingId, marker);
            }

            const markerElement = marker.getElement();
            markerElement.style.borderBottomColor = arrowColor;
            markerElement.style.transform = `rotate(${heading}deg)`;

            const speedKPH = speed * 3.6;

            marker.setLngLat(newLngLat)
                  .getPopup()
                  .setHTML(`
                    <h4>${type.toUpperCase()} ID: ${trackingId}</h4>
                    <p>Speed: ${speedKPH.toFixed(1)} km/h<br>Heading: ${heading.toFixed(0)}&deg;</p>
                  `);
            
            if (isTracking && trackingId === currentTrackingId) {
                 map.flyTo({ center: newLngLat, speed: 0.5 });
            } else if (!isTracking) {
                 map.flyTo({ center: newLngLat, speed: 0.5 });
            }
        }


        // --- AUTHENTICATION & SESSION HANDLING ---

        async function initializeSharerSession(user) {
            const { data, error } = await supabaseClient
                .from('vehicle_location')
                .select('tracking_id, vehicle_type')
                .eq('sharer_id', user.id)
                .single(); 

            if (error || !data) {
                authContainer.style.display = 'block';
                statusDiv.textContent = 'Error: No vehicle assigned to this account, or RLS is blocking access.';
                toggleButton.disabled = true;
                return;
            }

            currentTrackingId = data.tracking_id;
            currentVehicleType = data.vehicle_type;

            authContainer.style.display = 'none'; 
            statusDiv.textContent = `Sharer logged in as ${currentTrackingId} (${currentVehicleType}). Ready to share.`;
            statusDiv.style.color = '#007bff'; 
            toggleButton.disabled = false;
        }

        async function handleLogin() {
            const email = emailInput.value;
            const password = passwordInput.value;
            statusDiv.textContent = 'Attempting login...';

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                statusDiv.textContent = `Login Failed: ${error.message}`;
                statusDiv.style.color = '#dc3545';
            } else {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (user) {
                    initializeSharerSession(user);
                }
            }
        }
        
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                initializeSharerSession(session.user);
            } else {
                toggleButton.disabled = true;
                statusDiv.textContent = `Please log in to share location.`;
            }
        });

        // --- MAP INITIALIZATION ---

        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/streets-v12',
            center: DEFAULT_CENTER,
            zoom: 12
        });

        map.on('load', async () => {
             // 1. Fetch ALL initial vehicle locations (public viewer uses this)
             const { data, error } = await supabaseClient
                .from('vehicle_location')
                .select('*');

             if (data) {
                 data.forEach(updateMarker);
             }
             
             // 2. Start listening for real-time updates for all changes
             subscribeToLocationUpdates();
        });

        // --- TRACKING FUNCTIONS (SENDER) ---

        function simpleSnap(rawLat, rawLon, accuracy) {
            // Placeholder for future Map Matching API or local snapping logic
            return { lat: rawLat, lon: rawLon }; 
        }

        /**
         * Handles successful geolocation position updates, sends to Supabase, 
         * and implements local trip tracking logic.
         */
        async function success(position) {
            const rawLat = position.coords.latitude;
            const rawLon = position.coords.longitude;
            const rawSpeed = position.coords.speed || 0;
            const rawHeading = position.coords.heading || 0;
            const timestamp = position.timestamp;

            const snappedLocation = simpleSnap(rawLat, rawLon, position.coords.accuracy);
            
            // --- 🧭 LOCAL TRIP LOGIC (Saves Start/End points to Console) ---
            
            const isMoving = rawSpeed > SPEED_THRESHOLDS.SLOW;

            if (isMoving) {
                // A. Vehicle is MOVING (Clear stop state)
                if (currentTrip.stopTimer) {
                    clearTimeout(currentTrip.stopTimer);
                    currentTrip.stopTimer = null;
                }

                if (!currentTrip.isTrackingTrip) {
                    // B. CONFIRM TRIP START
                    currentTrip.isTrackingTrip = true;
                    currentTrip.startPoint = { lat: rawLat, lon: rawLon, timestamp: timestamp };
                    console.log(`TRIP START: ${new Date(timestamp).toLocaleTimeString()} at (${rawLat.toFixed(4)}, ${rawLon.toFixed(4)})`);
                }

            } else {
                // C. Vehicle is STOPPED (Start or continue stop timer)
                currentTrip.lastStop = { lat: rawLat, lon: rawLon, timestamp: timestamp };
                
                if (currentTrip.isTrackingTrip && !currentTrip.stopTimer) {
                    console.log(`Starting trip end confirmation timer...`);
                    
                    currentTrip.stopTimer = setTimeout(() => {
                        // D. CONFIRM TRIP END
                        const endPoint = currentTrip.lastStop;
                        
                        console.log('--- TRIP COMPLETED ---');
                        console.log(`Start Point (Lat/Lon): ${currentTrip.startPoint.lat.toFixed(4)}, ${currentTrip.startPoint.lon.toFixed(4)}`);
                        console.log(`End Point (Lat/Lon): ${endPoint.lat.toFixed(4)}, ${endPoint.lon.toFixed(4)}`);
                        const durationMinutes = (endPoint.timestamp - currentTrip.startPoint.timestamp) / 60000;
                        console.log(`Duration: ${durationMinutes.toFixed(1)} minutes`);
                        console.log('------------------------');

                        // Reset trip state
                        currentTrip.isTrackingTrip = false;
                        currentTrip.startPoint = null;
                        currentTrip.lastStop = null;
                        currentTrip.stopTimer = null;
                        
                        // Update status after confirmed trip end
                        statusDiv.textContent = 'Trip Completed. Ready for next trip.';
                    }, MIN_STOP_TIME_MS); 
                }
            }
            
            // --- 🌐 SUPABASE UPDATE (Runs every 30s) ---

            const { error: updateError } = await supabaseClient
                .from('vehicle_location')
                .update({ 
                    latitude: snappedLocation.lat, 
                    longitude: snappedLocation.lon,
                    vehicle_type: currentVehicleType,
                    speed: rawSpeed,                  
                    heading: rawHeading               
                })
                .eq('tracking_id', currentTrackingId); 

            if (updateError) {
                 console.error('Supabase update error:', updateError);
                 statusDiv.textContent = 'ERROR: Update failed.'; 
                 statusDiv.style.color = '#dc3545';
            } else if (!isMoving) {
                 statusDiv.textContent = `Stopped. Waiting to confirm trip end...`;
                 statusDiv.style.color = getSpeedColor(rawSpeed);
            } else {
                 const speedKPH = rawSpeed * 3.6;
                 statusDiv.textContent = `Sharing location. Speed: ${speedKPH.toFixed(1)} km/h.`;
                 statusDiv.style.color = getSpeedColor(rawSpeed);
            }
        }

        function error(err) {
            if (err.code === 1) { 
                statusDiv.textContent = 'Location sharing DENIED by user. Please allow access.';
            } else {
                statusDiv.textContent = `Tracking stopped. ERROR(${err.code}): ${err.message}`;
            }
            statusDiv.style.color = '#dc3545';
            stopTracking(); 
        }

        /**
         * Starts geolocation tracking using a 30-second interval.
         */
        function startTracking() {
            if (!navigator.geolocation) {
                statusDiv.textContent = 'Geolocation is not supported by your browser.';
                return;
            }
            if (!currentTrackingId) { 
                statusDiv.textContent = 'Please log in first and ensure a vehicle is assigned.';
                return;
            }
            
            const options = { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 };
            
            // Initial position update
            navigator.geolocation.getCurrentPosition(success, error, options);

            // Set up the 30-second interval for subsequent updates
            intervalID = setInterval(() => {
                navigator.geolocation.getCurrentPosition(success, error, options);
            }, PING_RATE_MS); 

            isTracking = true;

            toggleButton.textContent = "Stop Sharing Location (30s rate)";
            toggleButton.classList.remove('share-btn');
            toggleButton.classList.add('stop-btn');
        }

        /**
         * Stops location tracking by clearing the interval.
         */
        function stopTracking() {
             if (intervalID !== null) {
                clearInterval(intervalID);
                intervalID = null;
            }
            // Clear any pending trip end timer when stopping sharing
            if (currentTrip.stopTimer) {
                clearTimeout(currentTrip.stopTimer);
                currentTrip.stopTimer = null;
                console.log("Trip end confirmation timer cleared.");
            }
            currentTrip.isTrackingTrip = false; // Also reset trip state on stop

            isTracking = false;
            statusDiv.textContent = `Viewing live updates. Ready to share.`;
            statusDiv.style.color = '#007bff'; 
            toggleButton.textContent = "Start Sharing Location";
            toggleButton.classList.remove('stop-btn');
            toggleButton.classList.add('share-btn');
        }


        // --- TRACKING VIEWER (RECEIVER) ---

        function subscribeToLocationUpdates() {
            supabaseClient.channel('all_vehicles') 
                .on(
                    'postgres_changes',
                    { event: 'UPDATE', schema: 'public', table: 'vehicle_location' }, 
                    (payload) => {
                        updateMarker(payload.new);
                    }
                )
                .subscribe();
        }

        // --- EVENT LISTENERS ---
        toggleButton.onclick = () => {
            if (isTracking) {
                stopTracking();
            } else {
                startTracking();
            }
        };

        loginButton.onclick = handleLogin;
    </script>
</body>
</html>
