<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin | PubVehicleTracker</title>
    
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

    <style>
        :root { --sidebar: #0f172a; --bg: #f8fafc; --accent: #3b82f6; --danger: #ef4444; }
        body { margin: 0; display: flex; height: 100vh; font-family: 'Inter', sans-serif; background: var(--bg); overflow: hidden; }
        
        /* Auth Screen */
        #auth-screen { position: fixed; inset: 0; background: var(--sidebar); z-index: 999; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: white; padding: 40px; border-radius: 12px; width: 350px; text-align: center; }
        .auth-card input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        .auth-card button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* Sidebar & Layout */
        .sidebar { width: 280px; background: var(--sidebar); color: white; display: none; flex-direction: column; padding: 20px; }
        .nav-btn { padding: 12px; cursor: pointer; border-radius: 6px; margin-bottom: 5px; font-size: 0.85rem; }
        .nav-btn.active { background: var(--accent); }

        .main { flex: 1; display: none; flex-direction: column; overflow: hidden; position: relative; }
        .header { background: white; padding: 15px 30px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .view-container { padding: 20px; overflow-y: auto; flex: 1; padding-bottom: 60px; }
        
        #admin-map { height: calc(100vh - 120px); width: 100%; border-radius: 8px; background: #f1f5f9; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; }
        th { text-align: left; padding: 12px; background: #f8fafc; font-size: 0.7rem; color: #64748b; border-bottom: 1px solid #e2e8f0; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; font-size: 0.8rem; }
        
        /* Modal & Form Grid */
        #modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:2000; align-items:center; justify-content:center; }
        .modal-content { background:white; padding:25px; border-radius:12px; width:550px; max-height: 95vh; overflow-y: auto; }
        .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .full-width { grid-column: span 2; }
        .coord-group { background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
        
        /* Picker UI */
        .picker-btn { width: 100%; background: #fff; border: 1px solid var(--accent); color: var(--accent); padding: 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; font-weight: 600; margin-top: 8px; transition: 0.2s; }
        .picker-btn:hover { background: var(--accent); color: white; }
        .picker-btn.active { background: #1e293b; color: white; border-color: #1e293b; }
        #mini-map-container { display: none; height: 350px; width: 100%; margin: 15px 0; border-radius: 8px; border: 2px solid var(--accent); position: relative; overflow: hidden; }

        #add-btn { position:fixed; bottom:80px; right:30px; width:60px; height:60px; border-radius:50%; background:var(--accent); color:white; border:none; font-size:30px; cursor:pointer; box-shadow:0 10px 15px rgba(59,130,246,0.4); z-index:1000; display:none; }
        footer { position: absolute; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e2e8f0; padding: 8px 20px; font-size: 0.7rem; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <h1>Admin Console</h1>
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-pass" placeholder="Password">
            <button onclick="window.handleLogin()">Login</button>
        </div>
    </div>

    <div id="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title" style="margin:0 0 15px 0; font-size: 1.1rem;">New Entry</h2>
            <form id="entry-form">
                <div id="form-fields" class="field-grid"></div>
                <div id="mini-map-container">
                    <div id="mini-map" style="height: 100%; width:100%;"></div>
                </div>
                <button type="submit" style="width:100%; padding:14px; background:var(--accent); color:white; border:none; border-radius:6px; margin-top:10px; font-weight: bold; cursor:pointer;">Confirm & Save</button>
                <button type="button" onclick="window.closeModal()" style="width:100%; padding:10px; background:#f1f5f9; border:none; border-radius:6px; margin-top:5px; cursor:pointer;">Discard</button>
            </form>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <h2 style="color: var(--accent); font-size: 0.9rem; margin-bottom: 25px;">MASTER COMMAND</h2>
        <div class="nav-btn active" onclick="window.switchView('user_profiles', this)">Users</div>
        <div class="nav-btn" onclick="window.switchView('terminals', this)">Terminals</div>
        <div class="nav-btn" onclick="window.switchView('vehicles', this)">Fleet</div>
        <div class="nav-btn" onclick="window.switchView('active_routes', this)">Routes</div>
        <div class="nav-btn" onclick="window.switchView('live', this)" style="margin-top:20px; border: 1px solid #334155;">🛰️ HUB MONITOR</div>
        <button onclick="window.handleLogout()" style="margin-top: auto; padding: 10px; background: #334155; color: white; border: none; border-radius: 6px; cursor: pointer;">Logout</button>
    </div>

    <div class="main" id="main-content">
        <div class="header"><h1 id="view-title" style="margin:0; font-size: 1.1rem;">USER ACCESS</h1></div>
        <div class="view-container">
            <div id="view-table"><table><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div>
            <div id="view-live" style="display:none;"><div id="admin-map"></div></div>
        </div>
        <footer>
            <span>Alpha v0.007 | PubVehicleTracker Build</span>
            <span>Last Update: 2025-12-26 | Git Ref: Drop-Redundant-Column</span>
        </footer>
    </div>

    <button id="add-btn" onclick="window.openModal()">+</button>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const S_URL = 'https://uwptdzzlklkwoxudvrgc.supabase.co';
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3cHRkenpsa2xrd294dWR2cmdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIxNDg1NzIsImV4cCI6MjA3NzcyNDU3Mn0.fziXt9gx2ZBDiUxdzU2gupMgXBuneOteWa90L3C5F1k';
        const client = createClient(S_URL, S_KEY);
        mapboxgl.accessToken = 'pk.eyJ1Ijoiam1hZXN0cm8iLCJhIjoiY2xrZjVvZXcxMWF5ZTNlanNlcGJrcWhqNyJ9.0nAf21DdJ4dlaSmyQrkwxg';
        
        let map = null, miniMap = null, currentTable = 'user_profiles', initialLoad = true, pickerTarget = null;
        let markers = { v: {} }, miniMarkers = { start: null, end: null };

        const schemas = {
            user_profiles: ['id', 'full_name', 'role'],
            terminals: ['id', 'name', 'start_lat', 'start_lon', 'end_lat', 'end_lon'],
            vehicles: ['plate_number', 'vehicle_type', 'capacity'],
            active_routes: ['route_id', 'route_name', 'plate_number']
        };

        window.handleLogin = async () => {
            const { error } = await client.auth.signInWithPassword({
                email: document.getElementById('login-email').value,
                password: document.getElementById('login-pass').value
            });
            if (error) alert(error.message);
        };

        window.handleLogout = () => { client.auth.signOut(); location.reload(); };

        client.auth.onAuthStateChange(async (event, session) => {
            if (session) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('sidebar').style.display = 'flex';
                document.getElementById('main-content').style.display = 'flex';
                if (initialLoad) { window.switchView('user_profiles', document.querySelector('.nav-btn')); initialLoad = false; }
            } else { document.getElementById('auth-screen').style.display = 'flex'; }
        });

        window.switchView = (tableName, el) => {
            currentTable = tableName;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            const isMap = tableName === 'live';
            document.getElementById('view-table').style.display = isMap ? 'none' : 'block';
            document.getElementById('view-live').style.display = isMap ? 'block' : 'none';
            document.getElementById('add-btn').style.display = (isMap || tableName === 'user_profiles') ? 'none' : 'block';
            document.getElementById('view-title').innerText = tableName.toUpperCase().replace('_',' ');
            if (isMap) initMap(); else fetchTableData(tableName);
        };

        async function fetchTableData(tableName) {
            const { data } = await client.from(tableName).select('*');
            const cols = schemas[tableName];
            document.getElementById('table-head').innerHTML = `<tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr>`;
            const body = document.getElementById('table-body');
            body.innerHTML = (!data || data.length === 0) 
                ? `<tr><td colspan="${cols.length}" style="text-align:center; padding:40px; color:#94a3b8;">No records found.</td></tr>`
                : data.map(row => `<tr>${cols.map(c => `<td>${row[c] ?? '--'}</td>`).join('')}</tr>`).join('');
        }

        window.openModal = () => {
            const fields = document.getElementById('form-fields');
            fields.innerHTML = '';
            document.getElementById('mini-map-container').style.display = 'none';
            if (currentTable === 'terminals') renderTerminalForm(fields); else renderStandardForm(fields);
            document.getElementById('modal-overlay').style.display = 'flex';
        };

        function renderStandardForm(container) {
            schemas[currentTable].forEach(col => {
                const div = document.createElement('div');
                div.className = 'full-width';
                div.innerHTML = `<label style="font-size:0.7rem; font-weight:bold; color:#64748b;">${col.toUpperCase()}</label>
                <input name="${col}" placeholder="${col}" style="width:100%; padding:10px; margin-top:5px; border:1px solid #ddd; border-radius:4px; box-sizing:border-box;">`;
                container.appendChild(div);
            });
        }

        function renderTerminalForm(container) {
            ['id', 'name'].forEach(col => {
                const div = document.createElement('div');
                div.innerHTML = `<label style="font-size:0.7rem; font-weight:bold; color:#64748b;">${col.toUpperCase()}</label>
                <input name="${col}" placeholder="${col}" style="width:100%; padding:10px; margin-top:5px; border:1px solid #ddd; border-radius:4px; box-sizing:border-box;">`;
                container.appendChild(div);
            });
            const startGroup = document.createElement('div');
            startGroup.className = 'coord-group';
            startGroup.innerHTML = `<div style="font-size:0.75rem; font-weight:800; margin-bottom:10px;">START TERMINAL</div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px;">
                    <input id="input-start_lat" name="start_lat" placeholder="LAT" style="padding:8px; border:1px solid #ddd; border-radius:4px; font-size:0.75rem;">
                    <input id="input-start_lon" name="start_lon" placeholder="LON" style="padding:8px; border:1px solid #ddd; border-radius:4px; font-size:0.75rem;">
                </div>
                <button type="button" class="picker-btn" id="btn-pick-start" onclick="initPicker('start')">📍 PIN START</button>`;
            container.appendChild(startGroup);
            const endGroup = document.createElement('div');
            endGroup.className = 'coord-group';
            endGroup.innerHTML = `<div style="font-size:0.75rem; font-weight:800; margin-bottom:10px; color:var(--danger);">END TERMINAL</div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px;">
                    <input id="input-end_lat" name="end_lat" placeholder="LAT" style="padding:8px; border:1px solid #ddd; border-radius:4px; font-size:0.75rem;">
                    <input id="input-end_lon" name="end_lon" placeholder="LON" style="padding:8px; border:1px solid #ddd; border-radius:4px; font-size:0.75rem;">
                </div>
                <button type="button" class="picker-btn" id="btn-pick-end" onclick="initPicker('end')">📍 PIN END</button>`;
            container.appendChild(endGroup);
        }

        function initPicker(type) {
            pickerTarget = type;
            document.getElementById('mini-map-container').style.display = 'block';
            document.querySelectorAll('.picker-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-pick-${type}`).classList.add('active');
            if (!miniMap) {
                miniMap = new mapboxgl.Map({ container: 'mini-map', style: 'mapbox://styles/mapbox/streets-v12', center: [120.9842, 14.5995], zoom: 12 });
                miniMap.on('click', (e) => {
                    const { lng, lat } = e.lngLat;
                    document.getElementById(`input-${pickerTarget}_lat`).value = lat.toFixed(6);
                    document.getElementById(`input-${pickerTarget}_lon`).value = lng.toFixed(6);
                    if (miniMarkers[pickerTarget]) miniMarkers[pickerTarget].remove();
                    miniMarkers[pickerTarget] = new mapboxgl.Marker({color: pickerTarget === 'start' ? '#1e293b' : '#ef4444'}).setLngLat([lng, lat]).addTo(miniMap);
                });
            } else { setTimeout(() => miniMap.resize(), 100); }
        }

        window.closeModal = () => {
            document.getElementById('modal-overlay').style.display = 'none';
            if (miniMarkers.start) miniMarkers.start.remove(); if (miniMarkers.end) miniMarkers.end.remove();
            miniMarkers = { start: null, end: null }; pickerTarget = null;
        };

        document.getElementById('entry-form').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {};
            new FormData(e.target).forEach((val, key) => payload[key] = val);
            const { error } = await client.from(currentTable).insert([payload]);
            if (error) alert("Error: " + error.message); else { window.closeModal(); fetchTableData(currentTable); }
        };

        async function initMap() {
            if (map) return;
            map = new mapboxgl.Map({ container: 'admin-map', style: 'mapbox://styles/mapbox/streets-v12', center: [120.9842, 14.5995], zoom: 11 });
            const { data: terminals } = await client.from('terminals').select('*');
            terminals?.forEach(t => {
                const start = [parseFloat(t.start_lon), parseFloat(t.start_lat)];
                const end = [parseFloat(t.end_lon), parseFloat(t.end_lat)];
                new mapboxgl.Marker(markerEl('#1e293b')).setLngLat(start).setPopup(new mapboxgl.Popup().setHTML(`<b>START: ${t.name}</b>`)).addTo(map);
                if (t.end_lon) new mapboxgl.Marker(markerEl('#ef4444')).setLngLat(end).setPopup(new mapboxgl.Popup().setHTML(`<b>END: ${t.name}</b>`)).addTo(map);
            });
            client.channel('realtime-map').on('postgres_changes', { event: '*', schema: 'public', table: 'vehicle_location' }, p => updateVehicle(p.new)).subscribe();
        }

        function markerEl(color) {
            const el = document.createElement('div');
            el.style.cssText = `width:14px; height:14px; background:${color}; border:2px solid white; border-radius:2px;`;
            return el;
        }

        function updateVehicle(data) {
            if (!data.plate_number) return;
            const coords = [parseFloat(data.longitude), parseFloat(data.latitude)];
            if (markers.v[data.plate_number]) markers.v[data.plate_number].setLngLat(coords);
            else {
                const el = document.createElement('div'); el.style.cssText = "width:12px; height:12px; background:#10b981; border-radius:50%; border:2px solid white;";
                markers.v[data.plate_number] = new mapboxgl.Marker(el).setLngLat(coords).addTo(map);
            }
        }
    </script>
</body>
</html>
