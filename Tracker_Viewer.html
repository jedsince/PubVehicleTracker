        // --- DEVICE ORIENTATION ---
        function handleDeviceOrientation(event) {
            let heading = event.alpha;
            if (typeof event.webkitCompassHeading !== 'undefined') {
                heading = event.webkitCompassHeading;
            }
            if (heading !== null) {
                deviceOrientationHeading = heading < 0 ? 360 + heading : heading;
            }
        }
        window.addEventListener('deviceorientation', handleDeviceOrientation, true);
        
        // --- UTILITY FUNCTIONS ---
        function getSpeedColor(speed) {
            if (speed >= SPEED_THRESHOLDS.FAST) return '#28a745'; 
            if (speed >= SPEED_THRESHOLDS.MODERATE) return '#ffc107'; 
            if (speed > SPEED_THRESHOLDS.SLOW) return '#fd7e14'; 
            return '#dc3545'; 
        }

        function getHaversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }
        
        function simpleSnap(rawLat, rawLon, accuracy) {
            const precision = accuracy > 10 ? 4 : 5; 
            return { 
                lat: parseFloat(rawLat.toFixed(precision)), 
                lon: parseFloat(rawLon.toFixed(precision)) 
            }; 
        }

        // --- MAPBOX & TERMINAL DISPLAY ---
        function updateMarker(data) {
            const trackingId = data.tracking_id;
            if (!data.latitude || !data.longitude || !trackingId) return; 
            const type = data.vehicle_type || 'default';
            const newLngLat = [data.longitude, data.latitude];
            const speed = data.speed || 0;
            const heading = data.heading || 0; 
            const arrowColor = getSpeedColor(speed);
            let marker = activeMarkers.get(trackingId);
            
            if (!marker) {
                const el = document.createElement('div');
                el.className = 'direction-arrow';
                marker = new mapboxgl.Marker({ element: el, anchor: 'center' }) 
                    .setLngLat(newLngLat)
                    .setPopup(new mapboxgl.Popup({ offset: 25 })) 
                    .addTo(map);
                activeMarkers.set(trackingId, marker);
            }
            const markerElement = marker.getElement();
            markerElement.style.borderBottomColor = arrowColor;
            markerElement.style.transform = `rotate(${heading}deg)`;
            const speedKPH = speed * 3.6;
            marker.setLngLat(newLngLat)
                  .getPopup()
                  .setHTML(`
                    <h4>${type.toUpperCase()} ID: ${trackingId}</h4>
                    <p>Speed: ${speedKPH.toFixed(1)} km/h<br>Heading: ${heading.toFixed(0)}&deg;</p>
                  `);
            
            const isCurrentUser = isTracking && trackingId === currentTrackingId;
            if (isCurrentUser) {
                 map.flyTo({ center: newLngLat, speed: 0.5 });
            } else {
                 map.flyTo({ center: newLngLat, speed: 0.5 }); 
            }
            if (!isCurrentUser) {
                // 🛑 Pass current location data along with the tracking ID
                fetchAndDisplayViewerRoute(trackingId, data.latitude, data.longitude); 
            }
        }

        async function fetchAndDisplayAllTerminals() {
            const { data, error } = await supabaseClient.from('terminals').select('*');
            if (error) { console.error('Error fetching terminals:', error.message); return; }
            startTerminalSelect.innerHTML = '<option value="">-- Auto-Detect (Default) --</option>';
            endTerminalSelect.innerHTML = '<option value="">-- Select Route & Destination --</option>';
            endTerminalSelect.disabled = true;
            activeTerminalMarkers.forEach(marker => marker.remove());
            activeTerminalMarkers.clear();
            allTerminals = data;
            allTerminals.forEach(terminal => {
                const option = document.createElement('option');
                option.value = terminal.id;
                option.textContent = `${terminal.name} (Route: ${terminal.route_id || 'N/A'})`;
                startTerminalSelect.appendChild(option);
                const el = document.createElement('div');
                el.className = 'terminal-marker';
                el.textContent = terminal.name[0].toUpperCase();
                const marker = new mapboxgl.Marker({ element: el, anchor: 'center' })
                    .setLngLat([terminal.longitude, terminal.latitude])
                    .setPopup(new mapboxgl.Popup({ offset: 25 }).setHTML(`<b>${terminal.name}</b><br>Route ID: ${terminal.route_id || 'N/A'}`))
                    .addTo(map);
                activeTerminalMarkers.set(terminal.id, marker);
            });
            console.log(`Loaded ${allTerminals.length} terminals and populated dropdowns.`);
        }

        // 🛑 fetchAndDisplayRoute now accepts currentLat, currentLon for dynamic routing
        async function fetchAndDisplayRoute(startTerminal, endTerminal, currentLat, currentLon) {
            const startCoords = `${startTerminal.longitude},${startTerminal.latitude}`;
            const endCoords = `${endTerminal.longitude},${endTerminal.latitude}`;
            
            // NEW: Include the vehicle's current location as a via point
            const currentCoords = `${currentLon},${currentLat}`;

            const coordsString = `${startCoords};${currentCoords};${endCoords}`;
            
            const url = `https://api.mapbox.com/directions/v5/mapbox/driving/${coordsString}?geometries=geojson&access_token=${mapboxgl.accessToken}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
                    const route = data.routes[0].geometry;
                    const geoJson = {
                        type: 'FeatureCollection',
                        features: [{ type: 'Feature', geometry: route }]
                    };
                    
                    const routeSource = map.getSource(TRIP_ROUTE_SOURCE_ID);
                    if (routeSource) {
                        routeSource.setData(geoJson);
                    } else {
                        console.error(`ERROR: Map source '${TRIP_ROUTE_SOURCE_ID}' not found. Cannot draw route.`);
                    }

                } else {
                    console.warn('Mapbox Directions API error:', data.code, data.message || 'Unknown error');
                }
            } catch (apiError) {
                console.error('Error fetching Mapbox Directions:', apiError);
            }
        }

        // 🛑 fetchAndDisplayViewerRoute now accepts currentLat, currentLon
        async function fetchAndDisplayViewerRoute(trackingId, currentLat, currentLon) { 
            clearDisplayedRoute(); 

            const { data, error } = await supabaseClient
                .from('active_routes')
                .select('*')
                .eq('tracking_id', trackingId)
                .eq('is_active', true); 

            if (error) { console.error('Error fetching viewer route:', error.message); return; }
            if (!data || data.length === 0) { return; }

            const routeData = data[0]; 

            const startTerminal = { latitude: routeData.start_lat, longitude: routeData.start_lon, name: routeData.start_name };
            const endTerminal = { latitude: routeData.end_lat, longitude: routeData.end_lon, name: routeData.end_name };
            
            // MODIFIED CALL: Now uses the three-point route calculation
            fetchAndDisplayRoute(startTerminal, endTerminal, currentLat, currentLon); 
        }

        }

            supabaseClient.channel('all_terminals')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'terminals' }, (payload) => {

        function togglePinningMode() {

            if (tempTerminalMarker) {
                tempTerminalMarker.remove();
                tempTerminalMarker = null;
            }
            tempPinLocation = null;
            document.getElementById('pin-location-display').textContent = '';
            document.getElementById('savePinButton').disabled = true;
        }

        function savePinnedTerminal() {
            const terminalName = document.getElementById('terminalNameInput').value;
            const routeId = document.getElementById('routeIdInput').value.toUpperCase();
            if (!terminalName) { alert("Please enter a name for the new terminal!"); return; }
            if (!tempPinLocation) { alert("No pin dropped. Click the map first!"); return; }
            writeTerminalToSupabase(terminalName, tempPinLocation.lat, tempPinLocation.lon, routeId);
            togglePinningMode();
        }

        function captureAndSaveTerminal() {
            const terminalName = document.getElementById('terminalNameInput').value;
            const routeId = document.getElementById('routeIdInput').value.toUpperCase();
            if (!terminalName) { alert("Please enter a name!"); return; }
            if (!navigator.geolocation) { alert('Geolocation not supported.'); return; }
            const options = { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 };
            navigator.geolocation.getCurrentPosition(async (position) => {
                await writeTerminalToSupabase(terminalName, position.coords.latitude, position.coords.longitude, routeId);
                toggleSidebar(); // Close menu after action
            }, (err) => {
                alert(`Could not get GPS location: ${err.message}`);
            }, options);
        }
        
        async function writeTerminalToSupabase(name, lat, lon, routeId) {
            statusDiv.textContent = `Attempting to save ${name} (Route ${routeId || 'N/A'})...`;
            const { error } = await supabaseClient
                .from('terminals')
                .insert({
                    name: name, latitude: lat, longitude: lon, route_id: routeId || null 
                });
            if (error) {
                console.error('Terminal save error:', error);
                statusDiv.textContent = `ERROR saving terminal: ${error.message}`;
                statusDiv.style.color = '#dc3545';
            } else {
                statusDiv.textContent = `Successfully SAVED new terminal: ${name}!`;
                document.getElementById('terminalNameInput').value = '';
                document.getElementById('routeIdInput').value = ''; 
                fetchAndDisplayAllTerminals();
            }
        }

        // --- PASSENGER BEACON LOGIC ---
        
        // 🛑 NEW: Step 1 - Get location and find nearby routes
        function identifyNearbyRoutes() {
            routeToTrackSelect.innerHTML = '<option value="">-- Searching for Nearby Terminals... --</option>';
            if (!navigator.geolocation) {
                routeToTrackSelect.innerHTML = '<option value="">Geolocation not supported.</option>';
                return;
            }

            const options = { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 };
            navigator.geolocation.getCurrentPosition(position => {
                const currentLat = position.coords.latitude;
                const currentLon = position.coords.longitude;
                
                const nearbyTerminals = allTerminals.filter(terminal => {
                    return getHaversineDistance(currentLat, currentLon, terminal.latitude, terminal.longitude) < BEACON_TERMINAL_PROXIMITY_M;
                });

                const routeIds = [...new Set(nearbyTerminals.map(t => t.route_id).filter(id => id))];
                nearbyRoutes = routeIds;
                
                routeToTrackSelect.innerHTML = '<option value="">-- Select a Nearby Route --</option>';
                if (routeIds.length === 0) {
                    routeToTrackSelect.innerHTML = '<option value="">No active terminals within 500m.</option>';
                } else {
                    routeIds.forEach(id => {
                        const option = document.createElement('option');
                        option.value = id;
                        option.textContent = `Route: ${id}`;
                        routeToTrackSelect.appendChild(option);
                    });
                }
                vehicleToTrackSelect.disabled = true;
            }, err => {
                routeToTrackSelect.innerHTML = `<option value="">GPS Error: ${err.message}</option>`;
            }, options);
        }
        
        // 🛑 NEW: Step 2 - Fetch active vehicles on the selected route
        async function fetchActiveVehiclesByRoute(routeId) {
            vehicleToTrackSelect.innerHTML = '<option value="">-- Fetching Vehicles... --</option>';
            setVehicleButton.disabled = true;

            const { data: activeRoutes, error: activeRoutesError } = await supabaseClient
                .from('active_routes')
                .select('tracking_id, start_name')
                .eq('is_active', true)
                .like('route_id', routeId + '%'); // Use LIKE to match the start of the route ID

            if (activeRoutesError) {
                console.error('Error fetching active routes:', activeRoutesError);
                vehicleToTrackSelect.innerHTML = '<option value="">Error fetching vehicles.</option>';
                return;
            }

            vehicleToTrackSelect.innerHTML = '<option value="">-- Select Vehicle --</option>';
            if (activeRoutes.length === 0) {
                vehicleToTrackSelect.innerHTML = '<option value="">No vehicles currently active on this route.</option>';
                vehicleToTrackSelect.disabled = true;
            } else {
                activeRoutes.forEach(route => {
                    const option = document.createElement('option');
                    option.value = route.tracking_id;
                    option.textContent = `${route.tracking_id} (From: ${route.start_name})`;
                    vehicleToTrackSelect.appendChild(option);
                });
                vehicleToTrackSelect.disabled = false;
            }
        }


        // --- AUTHENTICATION & LOGIN/SIGNUP ---
        function toggleForms(showSignup) {
            loginErrorMessageDiv.textContent = ''; // Clear error when switching forms
            if (showSignup) {
                authContainer.style.display = 'none';
                signupContainer.style.display = 'block';
            } else {
                authContainer.style.display = 'block';
                signupContainer.style.display = 'none';
            }
        }

        signupRoleSelect.onchange = function() {
            if (this.value === 'driver') {
                signupTrackingIdInput.style.display = 'block';
                signupTrackingIdInput.setAttribute('required', 'required');
            } else {
                signupTrackingIdInput.style.display = 'none';
                signupTrackingIdInput.removeAttribute('required'); // For passengers, tracking ID is optional
            }
        };

        async function handleSignup() { 
            const name = signupNameInput.value.trim();
            const email = signupEmailInput.value.trim();
            const password = signupPasswordInput.value.trim();
            const role = signupRoleSelect.value;
            const trackingId = signupTrackingIdInput.value.trim().toUpperCase() || null;
            if (!name || !email || !password || !role) { statusDiv.textContent = 'Please fill out all required fields and select a role.'; statusDiv.style.color = '#dc3545'; return; }
            if (role === 'driver' && !trackingId) { statusDiv.textContent = 'Drivers must enter an assigned Vehicle ID.'; statusDiv.style.color = '#dc3545'; return; }
            statusDiv.textContent = 'Attempting to create account...';

            const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                email, password, options: { data: { full_name: name } }
            });

            if (authError) { statusDiv.textContent = `Signup Failed: ${authError.message}`; statusDiv.style.color = '#dc3545'; return; }
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (!session) {
                statusDiv.textContent = 'Account created, but could not establish an active session immediately. Please check your email to confirm your account, then log in.';
                statusDiv.style.color = '#dc3545';
                toggleForms(false); 
                return;
            }
            const userId = session.user.id; 

            const { error: profileError } = await supabaseClient
                .from('user_profiles')
                .insert({
                    id: userId, full_name: name, role: role, default_tracking_id: trackingId, is_active: true
                });

            if (profileError) {
                console.error('Profile insertion failed:', profileError);
                statusDiv.textContent = `Account created, but profile failed: ${profileError.message}. Please contact admin.`;
                statusDiv.style.color = '#dc3545';
                return;
            }
            if (role === 'driver' && trackingId) {
                // Sharer ID is the driver's UUID, which will be used for RLS
                const { error: vehicleError } = await supabaseClient
                    .from('vehicle_location')
                    .upsert({
                        tracking_id: trackingId, sharer_id: userId, vehicle_type: 'Jeepney', latitude: DEFAULT_CENTER[1], longitude: DEFAULT_CENTER[0]
                    });
                if (vehicleError) { console.warn('Could not assign vehicle location on signup:', vehicleError); }
            }
            
            statusDiv.textContent = 'SUCCESS! Account created and logged in.';
            statusDiv.style.color = '#28a745';
            initializeSharerSession(session.user);
            toggleSidebar(); // Close menu after successful signup
        }

        async function handleLogin() { 
            const email = emailInput.value;
            const password = passwordInput.value;
            
            loginErrorMessageDiv.textContent = ''; // Clear previous error
            statusDiv.textContent = 'Attempting login...'; // Status bar update for progress

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                // 🛑 Error message now appears inside the sidebar
                loginErrorMessageDiv.textContent = `Login Failed: ${error.message}`;
                statusDiv.textContent = `Login required to share location.`; // Reset status bar
            } else {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (user) {
                    initializeSharerSession(user);
                    toggleSidebar(); // Close menu after successful login
                }
            }
        }

        async function handleSignOut() { 
            const { error } = await supabaseClient.auth.signOut();
            if (error) { console.error('Sign Out Error:', error); statusDiv.textContent = `Sign Out Error: ${error.message}`; statusDiv.style.color = '#dc3545'; return; }
            stopTracking(); 
            currentTrackingId = null;
            currentVehicleType = null;
            currentUserRole = null;

            // Reset UI for signed out state
            authContainer.style.display = 'block'; 
            signupContainer.style.display = 'none'; 
            signOutButton.style.display = 'none'; 
            toggleButton.disabled = true;
            sharerControlsContainer.style.display = 'none';
            terminalToolsContainer.style.display = 'none'; 
            
            statusDiv.textContent = 'Signed out successfully. Viewing live updates publicly.';
            statusDiv.style.color = '#007bff';
            toggleSidebar(); // Close menu after sign out
        }
        

        // --- TRACKING SENDER LOGIC ---

        async function success(position) {
            const rawLat = position.coords.latitude;
            const rawLon = position.coords.longitude;
            const rawSpeed = position.coords.speed || 0;
            const gpsHeading = position.coords.heading; 
            const snappedLocation = simpleSnap(rawLat, rawLon, position.coords.accuracy); 
            const isMoving = rawSpeed > SPEED_THRESHOLDS.SLOW;

            let finalHeading = 0;
            if (rawSpeed > SPEED_THRESHOLDS.SLOW && gpsHeading !== null) {
                finalHeading = gpsHeading;
            } else if (deviceOrientationHeading !== null) {
                finalHeading = deviceOrientationHeading;
            } else {
                finalHeading = 0;
            }

            const manualStartId = startTerminalSelect.value;
            const manualEndId = endTerminalSelect.value;
            let manualStartTerminal = null;
            let manualEndTerminal = null;
            if (manualStartId && manualEndId) {
                manualStartTerminal = allTerminals.find(t => t.id == manualStartId);
                manualEndTerminal = allTerminals.find(t => t.id == manualEndId);
            }

            // --- TRIP LOGIC START ---
            if (isMoving) {
                if (currentTrip.stopTimer) { clearTimeout(currentTrip.stopTimer); currentTrip.stopTimer = null; }

                if (!currentTrip.isTrackingTrip) {
                    let closestStartTerminal = null;
                    let minStartDistance = Infinity;
                    allTerminals.forEach(terminal => {
                        const dist = getHaversineDistance(rawLat, rawLon, terminal.latitude, terminal.longitude);
                        if (dist < minStartDistance) { minStartDistance = dist; closestStartTerminal = terminal; }
                    });

                    let startTerminalToUse = null;
                    let endTerminalToUse = null;

                    if (manualStartTerminal && manualEndTerminal) {
                        startTerminalToUse = manualStartTerminal;
                        endTerminalToUse = manualEndTerminal;
                        statusDiv.textContent = `Trip Started (Manual): ${startTerminalToUse.name} -> ${endTerminalToUse.name}!`;
                    } else if (closestStartTerminal && minStartDistance < PROXIMITY_THRESHOLD_M && closestStartTerminal.route_id) {
                        startTerminalToUse = closestStartTerminal;
                        let destinations = allTerminals.filter(t => t.route_id === startTerminalToUse.route_id && t.id !== startTerminalToUse.id);
                        endTerminalToUse = destinations[0]; 
                        statusDiv.textContent = endTerminalToUse 
                            ? `Trip Started (Auto): ${startTerminalToUse.name} -> ${endTerminalToUse.name}!`
                            : `Trip Started (Auto) from ${startTerminalToUse.name} (Route not fully defined).`;
                    } else {
                        currentTrip.identifiedStartTerminal = null; 
                        statusDiv.textContent = `Trip Started! Sharing location. Speed: ${(rawSpeed * 3.6).toFixed(1)} km/h.`;
                    }

                    if (startTerminalToUse && endTerminalToUse) {
                        currentTrip.isTrackingTrip = true; 
                        currentTrip.identifiedStartTerminal = startTerminalToUse;
                        currentTrip.identifiedEndTerminal = endTerminalToUse; 
                        
                        // Pass current coordinates to draw the route
                        fetchAndDisplayRoute(
                            startTerminalToUse, 
                            endTerminalToUse, 
                            rawLat,             // Current Latitude
                            rawLon              // Current Longitude
                        );

                        const { error: routeError } = await supabaseClient
                            .from('active_routes')
                            .upsert({
                                tracking_id: currentTrackingId, start_name: startTerminalToUse.name, end_name: endTerminalToUse.name, start_lat: startTerminalToUse.latitude, start_lon: startTerminalToUse.longitude, end_lat: endTerminalToUse.latitude, end_lon: endTerminalToUse.longitude, is_active: true
                            });
                        if (routeError) { console.error('Error saving active route:', routeError); }
                    } else {
                        currentTrip.isTrackingTrip = true;
                    }
                }
                // If a trip is already tracking, update the route dynamically
                if (currentTrip.isTrackingTrip && currentTrip.identifiedStartTerminal && currentTrip.identifiedEndTerminal) {
                    fetchAndDisplayRoute(
                        currentTrip.identifiedStartTerminal, 
                        currentTrip.identifiedEndTerminal, 
                        rawLat,             // Current Latitude
                        rawLon              // Current Longitude
                    );
                }

            } else { 
                if (currentTrip.isTrackingTrip && !currentTrip.stopTimer) {
                    currentTrip.stopTimer = setTimeout(async () => {
                        clearDisplayedRoute();
                        currentTrip.isTrackingTrip = false;
                        currentTrip.startPoint = null;
                        currentTrip.lastStop = null;
                        currentTrip.stopTimer = null;
                        currentTrip.identifiedStartTerminal = null; 
                        currentTrip.identifiedEndTerminal = null;   
                        statusDiv.textContent = 'Trip Completed. Ready for next trip.';
                        await supabaseClient.from('active_routes').update({ is_active: false }).eq('tracking_id', currentTrackingId);
                    }, MIN_STOP_TIME_MS); 
                }
            }
            
            // --- SUPABASE UPDATE (Location) ---
            const { error: updateError } = await supabaseClient
                .from('vehicle_location')
                .update({ 
                    latitude: snappedLocation.lat, longitude: snappedLocation.lon, vehicle_type: currentVehicleType, speed: rawSpeed, heading: finalHeading 
                })
                .eq('tracking_id', currentTrackingId); 
            
            if (updateError) {
                 console.error('Supabase update error:', updateError);
                 statusDiv.textContent = 'ERROR: Update failed. Check RLS policy.'; 
                 statusDiv.style.color = '#dc3545';
            } else if (!isMoving) {
                 statusDiv.textContent = `Stopped. Waiting to confirm trip end... Heading: ${finalHeading.toFixed(0)}°`;
                 statusDiv.style.color = getSpeedColor(rawSpeed);
            } else if (!currentTrip.identifiedStartTerminal) { 
                const speedKPH = rawSpeed * 3.6;
                statusDiv.textContent = `Sharing location. Speed: ${speedKPH.toFixed(1)} km/h. Heading: ${finalHeading.toFixed(0)}°`;
                statusDiv.style.color = getSpeedColor(rawSpeed);
            }
        }

        function error(err) {
            if (err.code === 1) { 
                statusDiv.textContent = 'Location sharing DENIED by user. Please allow access.';
            } else {
                statusDiv.textContent = `Tracking stopped. ERROR(${err.code}): ${err.message}`;
            }
            statusDiv.style.color = '#dc3545';
            stopTracking(); 
        }

        function executeTrackingLogic() {
            const options = { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 };
            navigator.geolocation.getCurrentPosition(success, error, options); 
            intervalID = setInterval(() => {
                navigator.geolocation.getCurrentPosition(success, error, options);
            }, PING_RATE_MS); 

            isTracking = true;
            toggleButton.textContent = "Stop Sharing Location (30s rate)";
            toggleButton.classList.remove('share-btn');
            toggleButton.classList.add('stop-btn');
        }


        function startTracking() {
            if (!navigator.geolocation) { statusDiv.textContent = 'Geolocation is not supported by your browser.'; return; }
            if (!currentTrackingId) { statusDiv.textContent = 'Please select a vehicle ID or log in.'; return; }
            
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            executeTrackingLogic();
                        } else {
                            statusDiv.textContent = 'Orientation tracking denied. Heading will only update when moving.';
                            statusDiv.style.color = '#ffc107';
                            executeTrackingLogic();
                        }
                    })
                    .catch(console.error);
            } else {
                executeTrackingLogic();
            }
        }

        async function stopTracking() {
             if (intervalID !== null) { clearInterval(intervalID); intervalID = null; }
             if (currentTrip.stopTimer) { clearTimeout(currentTrip.stopTimer); currentTrip.stopTimer = null; }
             clearDisplayedRoute();
            
             if(currentTrackingId) { await supabaseClient.from('active_routes').update({ is_active: false }).eq('tracking_id', currentTrackingId); }

             currentTrip.isTrackingTrip = false; currentTrip.startPoint = null; currentTrip.lastStop = null; currentTrip.stopTimer = null; currentTrip.identifiedStartTerminal = null; currentTrip.identifiedEndTerminal = null;  
             isTracking = false;
             statusDiv.textContent = `Viewing live updates. Ready to share.`;
             statusDiv.style.color = '#007bff'; 
             toggleButton.textContent = "Start Sharing Location";
             toggleButton.classList.remove('stop-btn');
             toggleButton.classList.add('share-btn');
        }


        // --- EVENT LISTENERS ---
        loginButton.onclick = handleLogin; 
        signOutButton.onclick = handleSignOut; 
        showSignupLink.onclick = (e) => { e.preventDefault(); toggleForms(true); };
        showLoginLink.onclick = (e) => { e.preventDefault(); toggleForms(false); };
        signupButton.onclick = handleSignup; 

        document.getElementById('toggleButton').onclick = () => {
            if (isTracking) {
                stopTracking();
            } else {
                startTracking();
            }
        };

        // Terminal Menu Toggler
        document.getElementById('toggleTerminalMenuBtn').onclick = () => {
            const menu = document.getElementById('terminal-submenu');
            menu.style.display = menu.style.display === 'none' ? 'flex' : 'none';
        };

        document.getElementById('captureGPSButton').onclick = captureAndSaveTerminal;
        document.getElementById('dropPinButton').onclick = togglePinningMode;
        document.getElementById('savePinButton').onclick = savePinnedTerminal;


        // 🛑 NEW PASSENGER LISTENERS
        routeToTrackSelect.onchange = function() {
            const routeId = this.value;
            if (routeId) {
                fetchActiveVehiclesByRoute(routeId);
                vehicleToTrackSelect.disabled = false;
            } else {
                vehicleToTrackSelect.innerHTML = '<option value="">-- Choose Vehicle on Selected Route --</option>';
                vehicleToTrackSelect.disabled = true;
                setVehicleButton.disabled = true;
            }
        };

        vehicleToTrackSelect.onchange = function() {
            setVehicleButton.disabled = !this.value;
        };

        setVehicleButton.onclick = function() {
            const selectedId = vehicleToTrackSelect.value;
            if (selectedId) {
                currentTrackingId = selectedId;
                // Vehicle type is assumed or defaulted for the passenger beacon
                currentVehicleType = 'Jeepney'; 
                toggleButton.disabled = false;
                statusDiv.textContent = `Beacon set for ${currentTrackingId}. Press 'Start Sharing Location' to begin.`;
                statusDiv.style.color = '#28a745';
                toggleSidebar();
            } else {
                statusDiv.textContent = `Please select a valid Vehicle ID.`;
                statusDiv.style.color = '#dc3545';
            }
        };


        // --- MANUAL TRIP CONTROL LISTENERS ---
        startTerminalSelect.onchange = function() {
            const startId = this.value;
            endTerminalSelect.innerHTML = '<option value="">-- Select Destination --</option>';
            endTerminalSelect.disabled = true;

            if (startId) {
                const startTerminal = allTerminals.find(t => t.id == startId);
                if (startTerminal && startTerminal.route_id) {
                    const destinations = allTerminals.filter(t => t.route_id === startTerminal.route_id && t.id !== startTerminal.id);
                    destinations.forEach(terminal => {
                        const option = document.createElement('option');
                        option.value = terminal.id;
                        option.textContent = terminal.name;
                        endTerminalSelect.appendChild(option);
                    });
                    endTerminalSelect.disabled = destinations.length === 0;
                    if (destinations.length > 0) { statusDiv.textContent = `Route ${startTerminal.route_id} selected. Choose destination.`; } else { statusDiv.textContent = `Route ${startTerminal.route_id} has no other terminals defined.`; }
                } else { statusDiv.textContent = 'Selected terminal has no defined route.'; }
            } else { statusDiv.textContent = 'Auto-detect is active.'; }
        };

        drawManualRouteButton.onclick = function() {
            const startId = startTerminalSelect.value;
            const endId = endTerminalSelect.value;

            if (!startId || !endId) { alert("Please select both a Start and End terminal."); return; }

            const startTerminal = allTerminals.find(t => t.id == startId);
            const endTerminal = allTerminals.find(t => t.id == endId);

            if (startTerminal && endTerminal) {
                // When drawing manually, we don't have current vehicle location yet, so assume start
                fetchAndDisplayRoute(startTerminal, endTerminal, startTerminal.latitude, startTerminal.longitude);
                statusDiv.textContent = `MANUAL Route Drawn: ${startTerminal.name} to ${endTerminal.name}.`;
            }
        };

        clearManualRouteButton.onclick = function() {
            clearDisplayedRoute();
            statusDiv.textContent = 'Route line cleared.';
        };


        // --- INITIAL LOAD CHECK ---
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                initializeSharerSession(session.user);
            } else {
                toggleButton.disabled = true;
                sharerControlsContainer.style.display = 'none';
                terminalToolsContainer.style.display = 'none'; 
                signOutButton.style.display = 'none';
                authContainer.style.display = 'block';
                signupContainer.style.display = 'none';
                statusDiv.textContent = `Please log in or sign up to share location.`;
            }
        });
    </script>
</body>
</html>
