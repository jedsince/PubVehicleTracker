<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin | PubVehicleTracker</title>
    
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

    <style>
        :root { --sidebar: #0f172a; --bg: #f8fafc; --accent: #3b82f6; --danger: #ef4444; }
        body { margin: 0; display: flex; height: 100vh; font-family: 'Inter', sans-serif; background: var(--bg); overflow: hidden; }
        
        #auth-screen { position: fixed; inset: 0; background: var(--sidebar); z-index: 999; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: white; padding: 40px; border-radius: 12px; width: 350px; text-align: center; }
        .auth-card input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        .auth-card button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .sidebar { width: 280px; background: var(--sidebar); color: white; display: none; flex-direction: column; padding: 20px; }
        .nav-btn { padding: 12px; cursor: pointer; border-radius: 6px; margin-bottom: 5px; font-size: 0.85rem; }
        .nav-btn.active { background: var(--accent); }

        .main { flex: 1; display: none; flex-direction: column; overflow: hidden; }
        .header { background: white; padding: 15px 30px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .view-container { padding: 20px; overflow-y: auto; flex: 1; }
        
        #admin-map { height: calc(100vh - 120px); width: 100%; border-radius: 8px; background: #f1f5f9; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; }
        th { text-align: left; padding: 12px; background: #f8fafc; font-size: 0.7rem; color: #64748b; border-bottom: 1px solid #e2e8f0; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; font-size: 0.8rem; }
        
        #modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:2000; align-items:center; justify-content:center; }
        .modal-content { background:white; padding:25px; border-radius:12px; width:380px; max-height: 90vh; overflow-y: auto; }

        #add-btn { position:fixed; bottom:30px; right:30px; width:60px; height:60px; border-radius:50%; background:var(--accent); color:white; border:none; font-size:30px; cursor:pointer; box-shadow:0 10px 15px rgba(59,130,246,0.4); z-index:1000; display:none; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <h1>Admin Console</h1>
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-pass" placeholder="Password">
            <button onclick="window.handleLogin()">Login</button>
            <p id="auth-error" style="color: var(--danger); font-size: 0.75rem; margin-top: 10px; display: none;"></p>
        </div>
    </div>

    <div id="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title" style="margin:0 0 15px 0; font-size: 1.1rem;">New Record</h2>
            <form id="entry-form">
                <div id="form-fields"></div>
                <button type="submit" style="width:100%; padding:12px; background:var(--accent); color:white; border:none; border-radius:6px; margin-top:10px; font-weight: bold;">Save Entry</button>
                <button type="button" onclick="window.closeModal()" style="width:100%; padding:12px; background:#f1f5f9; border:none; border-radius:6px; margin-top:5px;">Cancel</button>
            </form>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <h2 style="color: var(--accent); font-size: 0.9rem; margin-bottom: 25px;">MASTER COMMAND</h2>
        <div class="nav-btn active" onclick="window.switchView('user_profiles', this)">Users</div>
        <div class="nav-btn" onclick="window.switchView('terminals', this)">Terminals</div>
        <div class="nav-btn" onclick="window.switchView('vehicles', this)">Fleet</div>
        <div class="nav-btn" onclick="window.switchView('active_routes', this)">Routes</div>
        <div class="nav-btn" onclick="window.switchView('live', this)" style="margin-top:20px; border: 1px solid #334155;">🛰️ HUB MONITOR</div>
        <button onclick="window.handleLogout()" style="margin-top: auto; padding: 10px; background: #334155; color: white; border: none; border-radius: 6px; cursor: pointer;">Logout</button>
    </div>

    <div class="main" id="main-content">
        <div class="header">
            <h1 id="view-title" style="margin:0; font-size: 1.1rem;">USER ACCESS</h1>
        </div>
        <div class="view-container">
            <div id="view-table">
                <table><thead id="table-head"></thead><tbody id="table-body"></tbody></table>
            </div>
            <div id="view-live" style="display:none;"><div id="admin-map"></div></div>
        </div>
    </div>

    <button id="add-btn" onclick="window.openModal()">+</button>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const S_URL = 'https://uwptdzzlklkwoxudvrgc.supabase.co';
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3cHRkenpsa2xrd294dWR2cmdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIxNDg1NzIsImV4cCI6MjA3NzcyNDU3Mn0.fziXt9gx2ZBDiUxdzU2gupMgXBuneOteWa90L3C5F1k';
        const client = createClient(S_URL, S_KEY);

        mapboxgl.accessToken = 'pk.eyJ1Ijoiam1hZXN0cm8iLCJhIjoiY2xrZjVvZXcxMWF5ZTNlanNlcGJrcWhqNyJ9.0nAf21DdJ4dlaSmyQrkwxg';
        
        let map = null, currentTable = 'user_profiles';
        let markers = { v: {} };

        // UPDATED SCHEMAS: Included end_lat and end_lon for terminals
        const schemas = {
            user_profiles: ['id', 'full_name', 'role'],
            terminals: ['id', 'name', 'start_lat', 'start_lon', 'end_lat', 'end_lon'],
            vehicles: ['plate_number', 'vehicle_type', 'capacity'],
            active_routes: ['route_id', 'route_name', 'plate_number']
        };

        window.handleLogin = async () => {
            const { error } = await client.auth.signInWithPassword({
                email: document.getElementById('login-email').value,
                password: document.getElementById('login-pass').value
            });
            if (error) alert(error.message);
        };

        window.handleLogout = () => { client.auth.signOut(); location.reload(); };

        client.auth.onAuthStateChange(async (event, session) => {
            if (session) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('sidebar').style.display = 'flex';
                document.getElementById('main-content').style.display = 'flex';
                window.switchView('user_profiles', document.querySelector('.nav-btn'));
            }
        });

        window.switchView = (tableName, el) => {
            currentTable = tableName;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            
            const isMap = tableName === 'live';
            document.getElementById('view-table').style.display = isMap ? 'none' : 'block';
            document.getElementById('view-live').style.display = isMap ? 'block' : 'none';
            document.getElementById('add-btn').style.display = (isMap || tableName === 'user_profiles') ? 'none' : 'block';
            document.getElementById('view-title').innerText = tableName.toUpperCase().replace('_',' ');

            if (isMap) initMap(); else fetchTableData(tableName);
        };

        async function fetchTableData(tableName) {
            const { data } = await client.from(tableName).select('*');
            const cols = schemas[tableName];
            document.getElementById('table-head').innerHTML = `<tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr>`;
            const body = document.getElementById('table-body');
            body.innerHTML = (!data || data.length === 0) 
                ? `<tr><td colspan="${cols.length}" style="text-align:center; padding:40px; color:#94a3b8;">No records found.</td></tr>`
                : data.map(row => `<tr>${cols.map(c => `<td>${row[c] ?? '--'}</td>`).join('')}</tr>`).join('');
        }

        window.openModal = () => {
            const fields = document.getElementById('form-fields');
            fields.innerHTML = '';
            
            schemas[currentTable].forEach(col => {
                const label = document.createElement('label');
                label.innerText = col.replace('_', ' ').toUpperCase();
                label.style.cssText = "font-size: 0.7rem; color: #64748b; font-weight: bold;";
                
                const input = document.createElement('input');
                input.name = col;
                input.placeholder = `Enter ${col.replace('_', ' ')}`;
                input.style.cssText = "width:100%; padding:10px; margin: 5px 0 12px 0; border:1px solid #ddd; border-radius:4px; box-sizing: border-box;";
                
                fields.appendChild(label);
                fields.appendChild(input);
            });
            document.getElementById('modal-overlay').style.display = 'flex';
        };

        window.closeModal = () => document.getElementById('modal-overlay').style.display = 'none';

        document.getElementById('entry-form').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {};
            new FormData(e.target).forEach((val, key) => payload[key] = val);
            const { error } = await client.from(currentTable).insert([payload]);
            if (error) alert("Error: " + error.message);
            else { window.closeModal(); fetchTableData(currentTable); }
        };

        // --- MAP LOGIC ---
        async function initMap() {
            if (map) return;
            map = new mapboxgl.Map({ container: 'admin-map', style: 'mapbox://styles/mapbox/streets-v12', center: [120.9842, 14.5995], zoom: 11 });
            
            const { data: terminals } = await client.from('terminals').select('*');
            terminals?.forEach(t => {
                // START MARKER
                const elStart = document.createElement('div');
                elStart.style.cssText = "width:14px; height:14px; background:#1e293b; border:2px solid white; border-radius:2px;";
                new mapboxgl.Marker(elStart).setLngLat([t.start_lon, t.start_lat]).setPopup(new mapboxgl.Popup().setHTML(`<b>Terminal Start: ${t.name}</b>`)).addTo(map);

                // END MARKER
                if (t.end_lon && t.end_lat) {
                    const elEnd = document.createElement('div');
                    elEnd.style.cssText = "width:14px; height:14px; background:#ef4444; border:2px solid white; border-radius:2px;";
                    new mapboxgl.Marker(elEnd).setLngLat([t.end_lon, t.end_lat]).setPopup(new mapboxgl.Popup().setHTML(`<b>Terminal End: ${t.name}</b>`)).addTo(map);
                }
            });

            client.channel('realtime-map')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'vehicle_location' }, p => updateVehicle(p.new))
                .subscribe();
        }

        function updateVehicle(data) {
            if (!data.plate_number) return;
            if (markers.v[data.plate_number]) {
                markers.v[data.plate_number].setLngLat([data.longitude, data.latitude]);
            } else {
                const el = document.createElement('div');
                el.style.cssText = "width:12px; height:12px; background:#10b981; border-radius:50%; border:2px solid white;";
                markers.v[data.plate_number] = new mapboxgl.Marker(el).setLngLat([data.longitude, data.latitude]).addTo(map);
            }
        }
    </script>
</body>
</html>
