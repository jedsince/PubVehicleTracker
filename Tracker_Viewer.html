<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin | PubVehicleTracker</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root { --sidebar: #0f172a; --bg: #f8fafc; --accent: #3b82f6; --danger: #ef4444; }
        body { margin: 0; display: flex; height: 100vh; font-family: 'Inter', sans-serif; background: var(--bg); overflow: hidden; }
        #auth-screen { position: fixed; inset: 0; background: var(--sidebar); z-index: 999; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: white; padding: 40px; border-radius: 12px; width: 350px; text-align: center; }
        .auth-card input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        .auth-card button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        #loading-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); z-index: 10000; color: white; align-items: center; justify-content: center; }
        .sidebar { width: 280px; background: var(--sidebar); color: white; display: none; flex-direction: column; padding: 20px; }
        .main { flex: 1; display: none; flex-direction: column; overflow: hidden; }
        .nav-btn { padding: 12px; cursor: pointer; border-radius: 6px; margin-bottom: 5px; font-size: 0.85rem; }
        .nav-btn.active { background: var(--accent); }
        #admin-map { height: calc(100vh - 120px); width: 100%; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th { text-align: left; padding: 10px; background: #f8fafc; font-size: 0.7rem; color: #64748b; border-bottom: 1px solid #e2e8f0; }
        td { padding: 10px; border-bottom: 1px solid #f1f5f9; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div id="loading-overlay">Verifying Identity...</div>

    <div id="auth-screen">
        <div class="auth-card">
            <h1>Admin Login</h1>
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-pass" placeholder="Password">
            <button onclick="window.handleLogin()">Sign In</button>
            <p id="auth-error" style="color: var(--danger); font-size: 0.75rem; margin-top: 10px; display: none;"></p>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <h2 style="color: var(--accent); font-size: 1rem; margin-bottom: 25px;">MASTER CONSOLE</h2>
        <div class="nav-btn active" onclick="window.switchView('user_profiles', this)">Users</div>
        <div class="nav-btn" onclick="window.switchView('vehicles', this)">Fleet</div>
        <div class="nav-btn" onclick="window.switchView('active_routes', this)">Routes</div>
        <div class="nav-btn" onclick="window.switchView('terminals', this)">Terminals</div>
        <div class="nav-btn" onclick="window.switchView('live', this)" style="margin-top:20px;">🛰️ LIVE VIEW</div>
        <button onclick="window.handleLogout()" style="margin-top: auto; padding: 10px; background: #334155; color: white; border: none; cursor: pointer;">Logout</button>
    </div>

    <div class="main" id="main-content">
        <div class="header" style="background:white; padding:15px 30px; border-bottom: 1px solid #e2e8f0;">
            <h1 id="view-title" style="margin:0; font-size: 1.1rem;">USER PROFILES</h1>
        </div>
        <div class="view-container" style="padding: 20px; overflow-y: auto; flex: 1;">
            <div id="view-table" class="section active">
                <table><thead id="table-head"></thead><tbody id="table-body"></tbody></table>
            </div>
            <div id="view-live" class="section">
                <div id="admin-map"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        import 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';

        const S_URL = 'https://uwptdzzlklkwoxudvrgc.supabase.co';
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3cHRkenpsa2xrd294dWR2cmdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIxNDg1NzIsImV4cCI6MjA3NzcyNDU3Mn0.fziXt9gx2ZBDiUxdzU2gupMgXBuneOteWa90L3C5F1k';
        const client = createClient(S_URL, S_KEY);

        let map = null;
        const markers = { v: {}, p: {} };

        // ATTACH TO WINDOW TO FIX REFERENCE ERROR
        window.handleLogin = async function() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-pass').value;
            document.getElementById('loading-overlay').style.display = 'flex';

            try {
                const { data, error } = await client.auth.signInWithPassword({ email, password });
                if (error) throw error;

                const { data: p } = await client.from('user_profiles').select('role').eq('id', data.user.id).single();
                if (!p || p.role !== 'admin') {
                    await client.auth.signOut();
                    throw new Error("Unauthorized: Admin role required.");
                }
            } catch (e) {
                document.getElementById('auth-error').innerText = e.message;
                document.getElementById('auth-error').style.display = 'block';
                document.getElementById('loading-overlay').style.display = 'none';
            }
        };

        window.handleLogout = () => { client.auth.signOut(); location.reload(); };

        window.switchView = function(tableName, el) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            const tableSec = document.getElementById('view-table');
            const liveSec = document.getElementById('view-live');

            if (tableName === 'live') {
                tableSec.classList.remove('active');
                liveSec.classList.add('active');
                initMap();
            } else {
                liveSec.classList.remove('active');
                tableSec.classList.add('active');
                fetchTableData(tableName);
            }
            document.getElementById('view-title').innerText = tableName.toUpperCase().replace('_', ' ');
        };

        client.auth.onAuthStateChange((event, session) => {
            if (session) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('sidebar').style.display = 'flex';
                document.getElementById('main-content').style.display = 'flex';
                document.getElementById('loading-overlay').style.display = 'none';
                fetchTableData('user_profiles');
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
            }
        });

        async function fetchTableData(tableName) {
            const { data } = await client.from(tableName).select('*').limit(50);
            if (!data || data.length === 0) return;
            const cols = Object.keys(data[0]);
            document.getElementById('table-head').innerHTML = `<tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr>`;
            document.getElementById('table-body').innerHTML = data.map(row => `
                <tr>${cols.map(c => `<td>${row[c] ?? '--'}</td>`).join('')}</tr>
            `).join('');
        }

        function initMap() {
            if (map || !window.L) return;
            map = L.map('admin-map').setView([14.5995, 120.9842], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            
            client.channel('live-mon').on('postgres_changes', { event: '*', schema: 'public', table: 'vehicle_location' }, p => updateLive(p.new, 'v'))
                .on('postgres_changes', { event: '*', schema: 'public', table: 'passenger_location' }, p => updateLive(p.new, 'p')).subscribe();
        }

        function updateLive(data, type) {
            if (!data || !data.latitude) return;
            const id = type === 'v' ? data.plate_number : data.user_id;
            if (markers[type][id]) {
                markers[type][id].setLatLng([data.latitude, data.longitude]);
            } else {
                markers[type][id] = L.circleMarker([data.latitude, data.longitude], { color: type === 'v' ? 'green' : 'blue', radius: 7 }).addTo(map);
            }
        }
    </script>
</body>
</html>
